  <style>

    .two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.three-col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;padding:11px 14px;border-radius:14px;cursor:pointer;font-weight:700;color:#5f728c}.tab.active{background:linear-gradient(135deg,#eafbf7,#f1f6ff);color:var(--teal)}
    .slot-wrap{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.slot{padding:10px 12px;border-radius:999px;background:#f4f8fc;border:1px solid #e2ebf5;color:#4d627c;font-size:13px;font-weight:700}.empty{padding:18px;border-radius:18px;background:#f8fbff;border:1px dashed #d8e6f2;color:var(--muted);text-align:center}

    .metric-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0 8px}.mini-stat{background:linear-gradient(180deg,#fff,#f8fbff);border:1px solid #e7eef7;border-radius:20px;padding:16px;min-width:0}.mini-stat strong{display:block;font-size:32px;line-height:1;margin:10px 0 8px}.muted-chip{display:inline-flex;padding:6px 10px;border-radius:999px;background:#f4f8fc;border:1px solid #e4edf7;color:#72859d;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:20px 0 16px}.list-table{border:1px solid #e8eef6;border-radius:22px;background:linear-gradient(180deg,#fff,#fbfdff);overflow:hidden}.list-row{display:grid;grid-template-columns:minmax(210px,1.5fr) 120px minmax(220px,1.2fr) 100px 170px;gap:14px;padding:16px 18px;border-bottom:1px solid #ebf1f7;font-size:14px;align-items:center}.list-row.head{background:#f9fbff;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8ca0b8}.user-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start}
    .form-card,.spotlight{background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border:1px solid rgba(221,231,242,.95);box-shadow:var(--shadow-soft);border-radius:24px;padding:22px}.spotlight{background:linear-gradient(135deg,#113d67 0,#0f766e 55%,#1aa692 100%);color:#fff}.spotlight p{color:#dff6f1;line-height:1.7}
    .report-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.chart-card{border:1px solid #e8eef6;border-radius:20px;padding:18px;background:linear-gradient(180deg,#fff,#fbfdff)}.bar-list{display:grid;gap:14px}.bar-row{display:grid;grid-template-columns:150px 1fr 40px;gap:12px;align-items:center}.bar-track{height:12px;border-radius:999px;background:#eef4f8;overflow:hidden}.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#0f766e,#14b8a6)}
    @media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.content-grid,.panel-grid,.report-grid{grid-template-columns:1fr}.login-shell{grid-template-columns:1fr;padding:18px}.hero h1{max-width:none}}
    @media (max-width:860px){.mobile-bar{display:block}.layout{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:67px;bottom:0;height:auto;width:290px;z-index:50;transform:translateX(-105%);transition:.22s}.sidebar.open{transform:translateX(0)}.main{padding:18px}.topbar{flex-direction:column;align-items:stretch}.search{min-width:0;width:100%}.toolbar{flex-direction:column;align-items:stretch}.list-row{grid-template-columns:1fr}.list-row.head{display:none}.metric-row,.three-col{grid-template-columns:1fr}.bar-row{grid-template-columns:1fr}.profile{grid-template-columns:1fr}}
    @media (max-width:640px){.stats,.two-col,.feature-grid{grid-template-columns:1fr}.hero,.login-card,.card,.form-card,.spotlight{border-radius:24px}.hero-strip h2{font-size:26px}}
  </style>

<body>
  <div class="mobile-bar hidden" id="mobileBar"><div class="mobile-shell"><div style="display:flex;align-items:center;gap:10px"><img src="assets/app-icon.png" alt="Guidance Point logo" style="width:42px;height:42px;padding:4px;border-radius:14px;border:1px solid #dfeaf3;background:#fff;object-fit:contain"><strong>Guidance Point</strong></div><button class="mobile-menu" onclick="toggleSidebar()">☰ Menu</button></div></div>
  <div id="app"></div>
<script>
const state={
  screen:'login', authMode:'signin', role:'student', page:'dashboard', search:'', authError:'', authSuccess:'', sidebarOpen:false,
  loginForm:{email:'',password:''},
  registerForm:{name:'',email:'',password:'',yearLevel:'',studentId:''},
  users:[
    {id:101,name:'Benedict Tanghal',role:'Student',email:'student@school.edu',password:'student123',status:'Active',department:'Grade 12',lastActive:'Today'},
    {id:102,name:'Ms. Rivera',role:'Counselor',email:'counselor@school.edu',password:'counselor123',status:'Active',department:'Guidance Office',lastActive:'1 hour ago'},
    {id:103,name:'Mr. Santos',role:'Counselor',email:'santos@school.edu',password:'santos123',status:'Active',department:'Guidance Office',lastActive:'Yesterday'},
    {id:104,name:'Admin Office',role:'Admin',email:'admin@school.edu',password:'admin123',status:'Active',department:'Administration',lastActive:'Today'}
  ],
  currentUser:null,
  appointments:[
    {id:1,student:'Benedict Tanghal',purpose:'Academic Advising',counselor:'Ms. Rivera',date:'2026-04-25',time:'09:00 AM',status:'Pending',note:'Need help with subject planning for next semester.',remark:''},
    {id:2,student:'Angela Cruz',purpose:'Counseling',counselor:'Mr. Santos',date:'2026-04-26',time:'01:30 PM',status:'Approved',note:'Personal concern and stress management.',remark:'Please arrive 10 minutes early.'},
    {id:3,student:'Miguel Reyes',purpose:'Student Support',counselor:'Ms. Rivera',date:'2026-04-27',time:'10:30 AM',status:'Rescheduled',note:'Follow-up for support documents.',remark:'Bring your updated support papers.'}
  ],
  notifications:[
    {id:1,title:'Appointment approved',message:'Your academic advising request with Ms. Rivera was approved.',time:'Today · 9:12 AM'},
    {id:2,title:'New booking reminder',message:'Students can now reserve available guidance slots for next week.',time:'Yesterday · 4:20 PM'},
    {id:3,title:'Counselor note',message:'Please bring any supporting forms for your student support consultation.',time:'Yesterday · 10:03 AM'}
  ],
  form:{purpose:'Counseling',counselor:'Ms. Rivera',date:'',time:'09:00 AM',note:''},
  formError:'', successMessage:'', editAppointmentId:null, remarkDrafts:{},
  userFilter:'All', userForm:{id:null,name:'',role:'Counselor',email:'',password:'',status:'Active',department:'',lastActive:'Just now'}, userMode:'create', userFormError:''
};
const SLOTS={'Ms. Rivera':['09:00 AM','10:30 AM','02:00 PM'],'Mr. Santos':['08:30 AM','01:30 PM','03:00 PM']};
const NAV={student:[['dashboard','Dashboard','◫'],['appointments','My Appointments','🗂'],['schedule','Available Schedule','🗓'],['notifications','Notifications','🔔'],['settings','Settings','⚙']],counselor:[['dashboard','Dashboard','◫'],['appointments','Requests','🗂'],['schedule','Availability','🗓'],['notifications','Notifications','🔔'],['settings','Settings','⚙']],admin:[['dashboard','Dashboard','◫'],['appointments','All Appointments','🗂'],['users','Users','👥'],['reports','Reports','📊'],['notifications','Notifications','🔔'],['settings','Settings','⚙']]};
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const statusClass=s=>String(s||'').toLowerCase();
const activeStatuses=['Pending','Approved','Rescheduled'];
const currentRole=()=> state.currentUser ? state.currentUser.role.toLowerCase() : state.role;
const currentNav=()=>NAV[currentRole()]||NAV.student;
function setAuthMode(m){state.authMode=m;state.authError='';state.authSuccess='';render();}
function updateLoginForm(k,v){state.loginForm[k]=v;}
function updateRegisterForm(k,v){state.registerForm[k]=v;}
function fillDemo(email,password){state.loginForm={email,password};state.authError='';render();}
function login(){const email=state.loginForm.email.trim().toLowerCase();const pw=state.loginForm.password;const user=state.users.find(u=>u.email.toLowerCase()===email&&u.password===pw&&u.status==='Active');if(!user){state.authError='Invalid email or password. Use a demo account or create a student account.';render();return;}state.currentUser={...user};state.role=user.role.toLowerCase();state.page='dashboard';state.screen='app';state.sidebarOpen=false;state.authError='';state.authSuccess='';state.search='';state.formError='';state.successMessage='';render();}
function registerStudent(){const f=state.registerForm; if(!f.name.trim()||!f.email.trim()||!f.password.trim()||!f.yearLevel.trim()||!f.studentId.trim()){state.authError='Please complete all student registration fields.';render();return;} if(state.users.some(u=>u.email.toLowerCase()===f.email.trim().toLowerCase())){state.authError='That email is already being used.';render();return;} const user={id:Date.now(),name:f.name.trim(),role:'Student',email:f.email.trim(),password:f.password,status:'Active',department:f.yearLevel.trim(),studentId:f.studentId.trim(),lastActive:'Just now'}; state.users.unshift(user); state.authSuccess='Student account created. You can now sign in.'; state.authError=''; state.registerForm={name:'',email:'',password:'',yearLevel:'',studentId:''}; state.authMode='signin'; state.loginForm.email=user.email; render(); }
function logout(){state.screen='login';state.currentUser=null;state.page='dashboard';state.authMode='signin';state.loginForm={email:'',password:''};state.authError='';state.authSuccess='';state.sidebarOpen=false;render();}
function toggleSidebar(){state.sidebarOpen=!state.sidebarOpen;render();}
function setPage(p){state.page=p;state.sidebarOpen=false;state.search='';state.successMessage='';state.formError='';render();}
function setSearch(v){state.search=v;render();}
function getTitle(){const found=currentNav().find(n=>n[0]===state.page);return found?found[1]:'Dashboard';}
function getDesc(){return {dashboard:'Overview of appointments, activity, and quick system status.',appointments:currentRole()==='student'?'Book new sessions and track your requests in one place.':currentRole()==='counselor'?'Review and update student requests from your queue.':'Review every appointment across the system.',schedule:currentRole()==='student'?'Check open guidance time slots before booking.':'Review counselor availability and open slots.',notifications:'Stay updated with confirmations, reminders, and system messages.',settings:'Manage profile details and basic system preferences.',users:'Counselors and admins are managed here. Students create their own accounts from the login page.',reports:'Quick analytics for appointments, statuses, and counselor load.'}[state.page]||'';}
function renderLogin(){document.getElementById('mobileBar').classList.add('hidden');return `<div class="login-shell"><section class="hero"><div><span class="badge">Guidance Point</span><img class="login-logo" src="assets/guidance-point-logo.png" alt="Guidance Point logo"><h1>Support booking that feels calm and easy.</h1><p>This website helps students schedule guidance appointments, lets counselors review requests faster, and gives admins a clearer overview of school support activity.</p><div class="feature-grid"><div class="feature"><strong>Student self-signup</strong><span>Students can create their own accounts on the login page instead of waiting for admin setup.</span></div><div class="feature"><strong>Cleaner admin user tab</strong><span>Better spacing, aligned columns, and stronger visual hierarchy improve scanability.</span></div><div class="feature"><strong>Reports added</strong><span>Admins now get quick appointment summaries and counselor workload insights.</span></div><div class="feature"><strong>Gentler interface</strong><span>Balanced spacing, softer contrast, and clearer hierarchy improve usability.</span></div></div></div><div class="feature"><strong>Demo access</strong><span>Use one of the demo accounts to test counselor and admin flows right away.</span></div></section><section class="login-wrap"><div class="login-card"><h2>${state.authMode==='signin'?'Welcome back':'Create student account'}</h2><p>${state.authMode==='signin'?'Sign in to continue to Guidance Point.':'Students can register here on their own. Counselors and admins are still managed internally.'}</p><div class="segmented"><button class="${state.authMode==='signin'?'active':''}" onclick="setAuthMode('signin')">Sign In</button><button class="${state.authMode==='signup'?'active':''}" onclick="setAuthMode('signup')">Student Sign Up</button></div>${state.authMode==='signin'?`<div class="field"><label>Email</label><input class="input" value="${esc(state.loginForm.email)}" oninput="updateLoginForm('email',this.value)" placeholder="Enter your school email"></div><div class="field"><label>Password</label><input class="input" type="password" value="${esc(state.loginForm.password)}" oninput="updateLoginForm('password',this.value)" placeholder="Enter your password"></div><div class="action-row" style="margin-top:20px"><button class="button primary" style="flex:1" onclick="login()">Sign in</button></div><div class="demo-grid"><div class="demo" onclick="fillDemo('student@school.edu','student123')"><div class="demo-top"><strong>Student Demo</strong><span class="mini student">Student</span></div><div class="sub">student@school.edu · student123</div></div><div class="demo" onclick="fillDemo('counselor@school.edu','counselor123')"><div class="demo-top"><strong>Counselor Demo</strong><span class="mini counselor">Counselor</span></div><div class="sub">counselor@school.edu · counselor123</div></div><div class="demo" onclick="fillDemo('admin@school.edu','admin123')"><div class="demo-top"><strong>Admin Demo</strong><span class="mini admin">Admin</span></div><div class="sub">admin@school.edu · admin123</div></div></div>`:`<div class="two-col"><div class="field" style="margin-top:0"><label>Full Name</label><input class="input" value="${esc(state.registerForm.name)}" oninput="updateRegisterForm('name',this.value)"></div><div class="field" style="margin-top:0"><label>Student ID</label><input class="input" value="${esc(state.registerForm.studentId)}" oninput="updateRegisterForm('studentId',this.value)"></div><div class="field" style="margin-top:0"><label>Email</label><input class="input" value="${esc(state.registerForm.email)}" oninput="updateRegisterForm('email',this.value)"></div><div class="field" style="margin-top:0"><label>Password</label><input class="input" type="password" value="${esc(state.registerForm.password)}" oninput="updateRegisterForm('password',this.value)"></div><div class="field" style="margin-top:0"><label>Year Level / Group</label><input class="input" value="${esc(state.registerForm.yearLevel)}" oninput="updateRegisterForm('yearLevel',this.value)" placeholder="Grade 12"></div></div><div class="action-row" style="margin-top:20px"><button class="button primary" style="flex:1" onclick="registerStudent()">Create student account</button></div><div class="info">Student accounts are self-registered here. Admin only manages counselor and admin staff accounts.</div>`}${state.authError?`<div class="error">${esc(state.authError)}</div>`:''}${state.authSuccess?`<div class="success">${esc(state.authSuccess)}</div>`:''}</div></section></div>`;}
function renderSidebar(){return `<aside class="sidebar ${state.sidebarOpen?'open':''}"><div class="brand"><div class="brand-logo"><img src="assets/app-icon.png" alt="Guidance Point logo"></div><div><h1>Guidance Point</h1><p>Online appointments</p></div></div><nav class="nav"><div class="nav-label">Navigation</div>${currentNav().map(n=>`<button class="nav-btn ${state.page===n[0]?'active':''}" onclick="setPage('${n[0]}')"><span class="nav-icon">${n[2]}</span><span>${n[1]}</span></button>`).join('')}</nav><div class="user-card"><strong>${esc(state.currentUser.name)}</strong><p>${esc(state.currentUser.role)} account</p><button class="button" onclick="logout()">Sign out</button></div></aside>`;}
function renderTop(){return `<header class="topbar"><div><div class="badge">Guidance Point</div><div style="margin-top:10px"><strong style="font-size:28px">${esc(getTitle())}</strong><div class="sub" style="margin-top:6px">${esc(getDesc())}</div></div></div><div class="search"><span>🔎</span><input value="${esc(state.search)}" oninput="setSearch(this.value)" placeholder="Search this page"></div></header>`;}
function renderHero(){return `<section class="hero-strip"><h2>${currentRole()==='admin'?'System visibility for the whole guidance process.':currentRole()==='counselor'?'Review requests faster and guide students with clarity.':'Book support in a calmer, clearer way.'}</h2><p>${currentRole()==='admin'?'Track appointment activity, review system status, and manage staff accounts from one place.':'This build keeps the interface lighter, softer, and easier to understand while preserving the core appointment flow.'}</p></section>`;}
function filteredAppointments(){const q=state.search.trim().toLowerCase(); return state.appointments.filter(a=>!q||[a.student,a.purpose,a.counselor,a.status,a.note,a.date,a.time].join(' ').toLowerCase().includes(q));}
function getStats(){const a=state.appointments; return {total:a.length,pending:a.filter(x=>x.status==='Pending').length,approved:a.filter(x=>x.status==='Approved').length,counselors:new Set(a.map(x=>x.counselor)).size};}
function renderStats(){const s=getStats(); return `<section class="stats"><div class="card"><div class="stat-top"><div><div class="stat-kicker">Total Appointments</div><div class="stat-value">${s.total}</div><div class="sub">All current records</div></div><div class="icon-chip">📅</div></div></div><div class="card"><div class="stat-top"><div><div class="stat-kicker">Pending Requests</div><div class="stat-value">${s.pending}</div><div class="sub">Awaiting counselor action</div></div><div class="icon-chip">⏳</div></div></div><div class="card"><div class="stat-top"><div><div class="stat-kicker">Approved</div><div class="stat-value">${s.approved}</div><div class="sub">Confirmed schedules</div></div><div class="icon-chip">✅</div></div></div><div class="card"><div class="stat-top"><div><div class="stat-kicker">Active Counselors</div><div class="stat-value">${s.counselors}</div><div class="sub">Support staff listed</div></div><div class="icon-chip">👤</div></div></div></section>`;}
function appointmentCard(a,actions=''){return `<div class="appointment"><div class="appointment-top"><div><h4>${esc(a.purpose)}</h4><div class="meta"><div><strong>Student:</strong> ${esc(a.student)}</div><div><strong>Counselor:</strong> ${esc(a.counselor)}</div><div><strong>Schedule:</strong> ${esc(a.date)} • ${esc(a.time)}</div></div><div class="note">${esc(a.note)}</div>${a.remark?`<div class="info" style="margin-top:12px"><strong>Counselor remark:</strong> ${esc(a.remark)}</div>`:''}</div><span class="status ${statusClass(a.status)}">${esc(a.status)}</span></div>${actions}</div>`;}
function getAvailableBookingSlots(counselor,date,ignoreId){const base=[...(SLOTS[counselor]||[])]; if(!date) return base; const blocked=new Set(state.appointments.filter(a=>a.counselor===counselor&&a.date===date&&a.id!==ignoreId&&activeStatuses.includes(a.status)).map(a=>a.time)); return base.filter(s=>!blocked.has(s));}
function updateBookingOptions(){const opts=getAvailableBookingSlots(state.form.counselor,state.form.date,state.editAppointmentId); if(!opts.includes(state.form.time)) state.form.time=opts[0]||''; render();}
function updateForm(k,v){state.form[k]=v; state.formError=''; state.successMessage=''; if(k==='counselor'||k==='date') updateBookingOptions(); else render();}
function saveBooking(){const f=state.form; if(!f.date||!f.time||!f.note.trim()) {state.formError='Please complete all booking fields.'; render(); return;} const me=state.currentUser.name; const conflict=state.appointments.find(a=>a.student===me&&a.date===f.date&&a.time===f.time&&a.id!==state.editAppointmentId&&activeStatuses.includes(a.status)); if(conflict){state.formError='You already have an active appointment at that same date and time.'; render(); return;} if(!getAvailableBookingSlots(f.counselor,f.date,state.editAppointmentId).includes(f.time)){state.formError='That time slot is already taken. Please choose another one.'; render(); return;} if(state.editAppointmentId){state.appointments=state.appointments.map(a=>a.id===state.editAppointmentId?{...a,purpose:f.purpose,counselor:f.counselor,date:f.date,time:f.time,note:f.note,status:'Rescheduled'}:a); state.successMessage='Appointment updated and marked as rescheduled.'; state.editAppointmentId=null;} else {state.appointments.unshift({id:Date.now(),student:me,purpose:f.purpose,counselor:f.counselor,date:f.date,time:f.time,status:'Pending',note:f.note,remark:''}); state.successMessage='Appointment request submitted.';} state.formError=''; state.form={purpose:'Counseling',counselor:'Ms. Rivera',date:'',time:'09:00 AM',note:''}; render();}
function startReschedule(id){const a=state.appointments.find(x=>x.id===id); if(!a) return; state.editAppointmentId=id; state.form={purpose:a.purpose,counselor:a.counselor,date:a.date,time:a.time,note:a.note}; state.page='appointments'; state.successMessage='You are now editing an appointment.'; render();}
function cancelAppointment(id){state.appointments=state.appointments.map(a=>a.id===id?{...a,status:'Cancelled'}:a); state.successMessage='Appointment cancelled.'; render();}
function updateRemarkDraft(id,val){state.remarkDrafts[id]=val;}
function saveRemark(id){state.appointments=state.appointments.map(a=>a.id===id?{...a,remark:(state.remarkDrafts[id]??a.remark).trim()}:a); state.successMessage='Remark saved.'; render();}
function updateStatus(id,status){state.appointments=state.appointments.map(a=>a.id===id?{...a,status}:a); state.successMessage='Appointment updated.'; render();}
function completeAppointment(id){updateStatus(id,'Completed');}
function renderDashboard(){const list=filteredAppointments(); if(currentRole()==='student'){const mine=list.filter(a=>a.student===state.currentUser.name); return `<div class="content-grid"><section class="card"><h3>Upcoming Requests</h3><div class="sub">A quick view of your most recent appointment activity.</div>${mine.length?mine.slice(0,3).map(a=>appointmentCard(a)).join(''):'<div class="empty" style="margin-top:14px">No appointments yet.</div>'}</section><section class="stack"><div class="card"><h3>Quick Actions</h3><div class="sub">Everything you need to keep your booking on track.</div><div style="display:grid;gap:12px;margin-top:14px"><button class="button primary" onclick="setPage('appointments')">Book an appointment</button><button class="button secondary" onclick="setPage('schedule')">Review available slots</button><button class="button secondary" onclick="setPage('notifications')">Check updates</button></div></div><div class="card"><h3>Student Notes</h3><div class="sub">Helpful reminders before your appointment.</div><div style="display:grid;gap:10px;margin-top:14px;font-size:14px;color:#5b6f88"><div>• Use your own account to book support.</div><div>• Keep your description short but clear.</div><div>• Watch for counselor remarks and status changes.</div></div></div></section></div>`;} if(currentRole()==='counselor'){const mine=list.filter(a=>a.counselor===state.currentUser.name); return `<div class="content-grid"><section class="card"><h3>Assigned Requests</h3><div class="sub">Latest student requests in your queue.</div>${mine.length?mine.slice(0,3).map(a=>appointmentCard(a,`<div class="action-row" style="margin-top:14px"><button class="button primary small" onclick="updateStatus(${a.id},'Approved')">Approve</button><button class="button secondary small" onclick="updateStatus(${a.id},'Rescheduled')">Reschedule</button></div>`)).join(''):'<div class="empty" style="margin-top:14px">No assigned requests found.</div>'}</section><section class="stack"><div class="card"><h3>Quick Actions</h3><div class="sub">Common tasks for reviewing student requests.</div><div style="display:grid;gap:12px;margin-top:14px"><button class="button primary" onclick="setPage('appointments')">Open full request list</button><button class="button secondary" onclick="setPage('schedule')">Review availability</button><button class="button secondary" onclick="setPage('notifications')">Check updates</button></div></div><div class="card"><h3>Guidance Notes</h3><div class="sub">Simple queue reminders.</div><div style="display:grid;gap:10px;margin-top:14px;font-size:14px;color:#5b6f88"><div>• Approve or reschedule requests clearly.</div><div>• Keep open slots visible to students.</div><div>• Review the dashboard before the next day starts.</div></div></div></section></div>`;} return `<div class="content-grid"><section class="card"><h3>System Overview</h3><div class="sub">Latest portal activity across all appointment records.</div>${list.length?list.slice(0,3).map(a=>appointmentCard(a)).join(''):'<div class="empty" style="margin-top:14px">No appointment activity yet.</div>'}</section><section class="stack"><div class="card"><h3>Admin Actions</h3><div class="sub">Main controls for this website structure.</div><div style="display:grid;gap:12px;margin-top:14px"><button class="button primary" onclick="setPage('appointments')">Review all appointments</button><button class="button secondary" onclick="setPage('users')">Open users list</button><button class="button secondary" onclick="setPage('reports')">Open reports</button></div></div><div class="card"><h3>Build Status</h3><div class="sub">This step fixes user management and adds student self-registration.</div><div style="display:grid;gap:10px;margin-top:14px;font-size:14px;color:#5b6f88"><div>✓ Student self-signup</div><div>✓ Cleaner user management layout</div><div>✓ Admin reports page</div><div>✓ Booking validation and lifecycle</div><div>↻ Database integration next</div></div></div></section></div>`;}
function renderStudentAppointments(){const mine=state.appointments.filter(a=>a.student===state.currentUser.name); const slots=getAvailableBookingSlots(state.form.counselor,state.form.date,state.editAppointmentId); return `<div class="content-grid"><section class="card"><h3>${state.editAppointmentId?'Reschedule Appointment':'Book an Appointment'}</h3><div class="sub">Submit a new request for counseling, advising, or student support.</div>${state.successMessage?`<div class="success">${esc(state.successMessage)}</div>`:''}${state.formError?`<div class="error">${esc(state.formError)}</div>`:''}<div class="two-col"><div class="field" style="grid-column:1/-1"><label>Purpose</label><select class="select" onchange="updateForm('purpose',this.value)"><option ${state.form.purpose==='Counseling'?'selected':''}>Counseling</option><option ${state.form.purpose==='Academic Advising'?'selected':''}>Academic Advising</option><option ${state.form.purpose==='Student Support'?'selected':''}>Student Support</option></select></div><div class="field" style="margin-top:0"><label>Counselor</label><select class="select" onchange="updateForm('counselor',this.value)">${Object.keys(SLOTS).map(n=>`<option ${state.form.counselor===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field" style="margin-top:0"><label>Date</label><input class="input" type="date" value="${esc(state.form.date)}" oninput="updateForm('date',this.value)"></div><div class="field" style="margin-top:0"><label>Time Slot</label><select class="select" onchange="updateForm('time',this.value)">${slots.length?slots.map(s=>`<option ${state.form.time===s?'selected':''}>${esc(s)}</option>`).join(''):'<option value="">No open slots</option>'}</select></div><div class="field" style="grid-column:1/-1;margin-top:0"><label>Short Description</label><textarea class="textarea" oninput="updateForm('note',this.value)">${esc(state.form.note)}</textarea></div></div><div class="action-row" style="margin-top:18px"><button class="button secondary" onclick="state.form={purpose:'Counseling',counselor:'Ms. Rivera',date:'',time:'09:00 AM',note:''};state.editAppointmentId=null;state.formError='';state.successMessage='';render();">Reset</button><button class="button primary" onclick="saveBooking()">${state.editAppointmentId?'Save Changes':'Submit Request'}</button></div></section><section class="card"><h3>My Appointments</h3><div class="sub">Track your current and past requests.</div>${mine.length?mine.map(a=>appointmentCard(a, activeStatuses.includes(a.status)?`<div class="action-row" style="margin-top:14px"><button class="button secondary small" onclick="startReschedule(${a.id})">Request Reschedule</button><button class="button soft small" style="color:var(--rose);border-color:#ffd1dc;background:#fff5f7" onclick="cancelAppointment(${a.id})">Cancel</button></div>`:'')).join(''):'<div class="empty" style="margin-top:14px">No appointments yet.</div>'}</section></div>`;}
function renderCounselorAppointments(){const list=filteredAppointments().filter(a=>a.counselor===state.currentUser.name); return `<div class="page-grid"><section class="card"><h3>Request Queue</h3><div class="sub">Review student appointments assigned to your counseling queue.</div>${state.successMessage?`<div class="success">${esc(state.successMessage)}</div>`:''}${list.length?list.map(a=>appointmentCard(a,`<div class="remark-box"><label class="remark-label">Counselor Remark</label><textarea class="textarea" oninput="updateRemarkDraft(${a.id},this.value)">${esc(state.remarkDrafts[a.id]??a.remark??'')}</textarea><div class="action-row" style="margin-top:12px"><button class="button secondary small" onclick="saveRemark(${a.id})">Save Remark</button><button class="button primary small" onclick="updateStatus(${a.id},'Approved')">Approve</button><button class="button secondary small" onclick="updateStatus(${a.id},'Rescheduled')">Reschedule</button><button class="button secondary small" onclick="completeAppointment(${a.id})">Mark Completed</button><button class="button soft small" style="color:var(--rose);border-color:#ffd1dc;background:#fff5f7" onclick="updateStatus(${a.id},'Rejected')">Reject</button></div></div>`)).join(''):'<div class="empty" style="margin-top:14px">No matching requests found.</div>'}</section></div>`;}
function renderAdminAppointments(){const list=filteredAppointments(); return `<div class="page-grid"><section class="card"><h3>All Appointments</h3><div class="sub">Admin-wide view of all appointment activity.</div>${list.length?list.map(a=>appointmentCard(a)).join(''):'<div class="empty" style="margin-top:14px">No appointments found.</div>'}</section></div>`;}
function renderSchedule(){return `<div class="page-grid"><section class="card"><h3>${currentRole()==='student'?'Available Time Slots':'Current Availability'}</h3><div class="sub">${currentRole()==='student'?'Review open counselor schedules before booking.':'Preview the guidance schedule currently shown in the system.'}</div>${Object.entries(SLOTS).map(([n,slots])=>`<div class="appointment"><h4 style="margin:0">${esc(n)}</h4><div class="slot-wrap">${slots.map(s=>`<span class="slot">${esc(s)}</span>`).join('')}</div></div>`).join('')}</section></div>`;}
function renderNotifications(){const list=state.notifications.filter(n=>!state.search||[n.title,n.message,n.time].join(' ').toLowerCase().includes(state.search.toLowerCase())); return `<div class="page-grid"><section class="card"><h3>Notifications</h3><div class="sub">Recent reminders, updates, and appointment messages.</div>${list.map(n=>`<div class="notif"><div class="notif-icon">🔔</div><div><strong>${esc(n.title)}</strong><div class="note" style="margin-top:6px">${esc(n.message)}</div><div class="sub" style="margin-top:8px">${esc(n.time)}</div></div></div>`).join('')}</section></div>`;}
function setUserFilter(v){state.userFilter=v; render();}
function openCreateUser(){state.userMode='create'; state.userForm={id:null,name:'',role:'Counselor',email:'',password:'',status:'Active',department:'',lastActive:'Just now'}; state.userFormError=''; render();}
function editUser(id){const u=state.users.find(x=>x.id===id); if(!u) return; state.userMode='edit'; state.userForm={...u}; state.userFormError=''; render();}
function updateUserForm(k,v){state.userForm[k]=v;}
function toggleUserStatus(id){state.users=state.users.map(u=>u.id===id?{...u,status:u.status==='Active'?'Inactive':'Active'}:u); render();}
function saveUser(){const f=state.userForm; if(!f.name.trim()||!f.email.trim()||!f.password.trim()){state.userFormError='Please complete all required staff account fields.'; render(); return;} if(f.role==='Student'){state.userFormError='Students should sign up on their own from the login page.'; render(); return;} const dupe=state.users.find(u=>u.email.toLowerCase()===f.email.trim().toLowerCase()&&u.id!==f.id); if(dupe){state.userFormError='That email is already being used.'; render(); return;} if(f.id){state.users=state.users.map(u=>u.id===f.id?{...f,email:f.email.trim(),name:f.name.trim(),department:f.department.trim()}:u); state.successMessage='Staff account updated.';} else {state.users.unshift({...f,id:Date.now(),email:f.email.trim(),name:f.name.trim(),department:f.department.trim()}); state.successMessage='Staff account created.';} openCreateUser();}
function renderUsers(){const q=state.search.trim().toLowerCase(); const users=state.users.filter(u=>(!q||[u.name,u.role,u.email,u.status,u.department].join(' ').toLowerCase().includes(q))&&(state.userFilter==='All'||u.role===state.userFilter)); const activeCount=state.users.filter(u=>u.status==='Active').length; const counselorCount=state.users.filter(u=>u.role==='Counselor').length; const studentCount=state.users.filter(u=>u.role==='Student').length; return `<div class="panel-grid"><section class="stack"><div class="card"><h3>User Management</h3><div class="sub">Counselors and admins are managed here. Students create their own accounts from the sign-up screen.</div><div class="metric-row"><div class="mini-stat"><span class="muted-chip">Total users</span><strong>${state.users.length}</strong><div class="sub">Accounts in this build</div></div><div class="mini-stat"><span class="muted-chip">Active users</span><strong>${activeCount}</strong><div class="sub">Currently enabled</div></div><div class="mini-stat"><span class="muted-chip">Students</span><strong>${studentCount}</strong><div class="sub">Self-registered accounts</div></div></div><div class="toolbar"><div class="tabs"><button class="tab ${state.userFilter==='All'?'active':''}" onclick="setUserFilter('All')">All</button><button class="tab ${state.userFilter==='Student'?'active':''}" onclick="setUserFilter('Student')">Students</button><button class="tab ${state.userFilter==='Counselor'?'active':''}" onclick="setUserFilter('Counselor')">Counselors</button><button class="tab ${state.userFilter==='Admin'?'active':''}" onclick="setUserFilter('Admin')">Admins</button></div><button class="button primary" onclick="openCreateUser()">Add Staff Account</button></div><div class="list-table"><div class="list-row head"><div>Name</div><div>Role</div><div>Email</div><div>Status</div><div>Actions</div></div>${users.length?users.map(u=>`<div class="list-row"><div><strong>${esc(u.name)}</strong><div class="sub" style="margin-top:4px">${esc(u.department||'—')} · ${esc(u.lastActive||'—')}</div></div><div><span class="pill ${esc(String(u.role).toLowerCase())}">${esc(u.role)}</span></div><div>${esc(u.email)}</div><div><span class="pill ${u.status==='Active'?'active':'inactive'}">${esc(u.status)}</span></div><div class="user-actions">${u.role==='Student'?`<button class="button secondary small" onclick="toggleUserStatus(${u.id})">${u.status==='Active'?'Deactivate':'Activate'}</button>`:`<button class="button secondary small" onclick="editUser(${u.id})">Edit</button><button class="button soft small" onclick="toggleUserStatus(${u.id})">${u.status==='Active'?'Deactivate':'Activate'}</button>`}</div></div>`).join(''):`<div class="empty" style="margin:14px">No matching users found.</div>`}</div></div></section><section class="stack"><div class="form-card"><h3>${state.userMode==='edit'?'Edit Staff Account':'Add Staff Account'}</h3><div class="sub">Use this panel for counselors and admins only.</div>${state.userFormError?`<div class="error">${esc(state.userFormError)}</div>`:''}${state.successMessage?`<div class="success">${esc(state.successMessage)}</div>`:''}<div class="field"><label>Full Name</label><input class="input" value="${esc(state.userForm.name)}" oninput="updateUserForm('name',this.value)"></div><div class="field"><label>Email</label><input class="input" value="${esc(state.userForm.email)}" oninput="updateUserForm('email',this.value)"></div><div class="field"><label>Password</label><input class="input" value="${esc(state.userForm.password||'')}" oninput="updateUserForm('password',this.value)"></div><div class="two-col"><div class="field" style="margin-top:0"><label>Role</label><select class="select" onchange="updateUserForm('role',this.value)"><option ${state.userForm.role==='Counselor'?'selected':''}>Counselor</option><option ${state.userForm.role==='Admin'?'selected':''}>Admin</option></select></div><div class="field" style="margin-top:0"><label>Status</label><select class="select" onchange="updateUserForm('status',this.value)"><option ${state.userForm.status==='Active'?'selected':''}>Active</option><option ${state.userForm.status==='Inactive'?'selected':''}>Inactive</option></select></div></div><div class="field"><label>Department / Group</label><input class="input" value="${esc(state.userForm.department)}" oninput="updateUserForm('department',this.value)"></div><div class="action-row" style="margin-top:18px"><button class="button primary" onclick="saveUser()">${state.userMode==='edit'?'Save Changes':'Create Staff Account'}</button><button class="button secondary" onclick="openCreateUser()">Reset</button></div></div><div class="spotlight"><h4>What changed here</h4><p>The metrics are now aligned properly, the table layout is cleaner, and the action panel now respects your rule that students should not be manually created by admin.</p></div></section></div>`;}
function renderReports(){const ap=state.appointments; const byStatus=['Pending','Approved','Rescheduled','Completed','Rejected','Cancelled'].map(s=>({label:s,value:ap.filter(a=>a.status===s).length})).filter(x=>x.value>0); const byCounselor=Object.keys(SLOTS).map(n=>({label:n,value:ap.filter(a=>a.counselor===n).length})); const max=Math.max(1,...byCounselor.map(x=>x.value),...byStatus.map(x=>x.value)); return `<div class="report-grid"><section class="stack"><div class="card"><h3>Appointment Status Summary</h3><div class="sub">Quick snapshot of how requests are moving through the system.</div><div class="bar-list" style="margin-top:18px">${byStatus.map(r=>`<div class="bar-row"><div><strong>${esc(r.label)}</strong></div><div class="bar-track"><div class="bar-fill" style="width:${(r.value/max)*100}%"></div></div><div>${r.value}</div></div>`).join('')}</div></div><div class="card"><h3>Counselor Workload</h3><div class="sub">Current appointment counts by counselor.</div><div class="bar-list" style="margin-top:18px">${byCounselor.map(r=>`<div class="bar-row"><div><strong>${esc(r.label)}</strong></div><div class="bar-track"><div class="bar-fill" style="width:${(r.value/max)*100}%"></div></div><div>${r.value}</div></div>`).join('')}</div></div></section><section class="stack"><div class="card"><h3>Report Highlights</h3><div class="sub">Simple admin insights for this build.</div><div class="three-col" style="margin-top:16px"><div class="mini-stat"><span class="muted-chip">Pending</span><strong>${ap.filter(a=>a.status==='Pending').length}</strong><div class="sub">Need review</div></div><div class="mini-stat"><span class="muted-chip">Completed</span><strong>${ap.filter(a=>a.status==='Completed').length}</strong><div class="sub">Finished sessions</div></div><div class="mini-stat"><span class="muted-chip">Counselors</span><strong>${Object.keys(SLOTS).length}</strong><div class="sub">Available in system</div></div></div></div><div class="spotlight"><h4>Next recommended step</h4><p>Connect this build to a real database so student self-signups, appointments, counselor remarks, and admin reports are saved permanently.</p></div></section></div>`;}
function renderSettings(){return `<div class="content-grid"><section class="card"><h3>Profile Settings</h3><div class="sub">Basic profile information for this demo build.</div><div class="profile" style="margin-top:16px"><div class="avatar">${esc((state.currentUser.name||'U').charAt(0))}</div><div><strong style="font-size:22px">${esc(state.currentUser.name)}</strong><div class="sub" style="margin-top:6px">${esc(state.currentUser.email)}</div><div style="margin-top:10px"><span class="pill ${esc(currentRole())}">${esc(state.currentUser.role)}</span></div></div></div><div class="two-col" style="margin-top:18px"><div class="field" style="margin-top:0"><label>Full Name</label><input class="input" value="${esc(state.currentUser.name)}"></div><div class="field" style="margin-top:0"><label>Email</label><input class="input" value="${esc(state.currentUser.email)}"></div><div class="field" style="margin-top:0"><label>Password</label><input class="input" type="password" value="demo-password"></div><div class="field" style="margin-top:0"><label>Notification Preference</label><select class="select"><option>In-app only</option><option>Email and in-app</option></select></div></div><div class="action-row" style="margin-top:18px"><button class="button primary">Save Changes</button><button class="button secondary">Cancel</button></div></section><section class="stack"><div class="card"><h3>System Preference Notes</h3><div class="sub">Placeholder settings for the current website version.</div><div style="display:grid;gap:10px;margin-top:14px;font-size:14px;color:#5b6f88"><div>• Profile saving is visual only for now.</div><div>• Authentication is still demo-based.</div><div>• Real user storage comes in the database step.</div></div></div></section></div>`;}
function renderPage(){if(state.page==='dashboard') return renderDashboard(); if(state.page==='appointments') return currentRole()==='student'?renderStudentAppointments():currentRole()==='counselor'?renderCounselorAppointments():renderAdminAppointments(); if(state.page==='schedule') return renderSchedule(); if(state.page==='notifications') return renderNotifications(); if(state.page==='users') return renderUsers(); if(state.page==='reports') return renderReports(); if(state.page==='settings') return renderSettings(); return renderDashboard();}
function renderApp(){document.getElementById('mobileBar').classList.remove('hidden'); return `<div class="layout">${renderSidebar()}<main class="main">${renderTop()}${renderHero()}${renderStats()}${renderPage()}</main></div>`;}
function render(){app.innerHTML=state.screen==='login'?renderLogin():renderApp();}
render();
</script>
</body></html>
