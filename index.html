<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guidance Point</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f4f7fb; --panel:#ffffff; --panel-soft:#f8fbff; --line:#dde7f2; --text:#17304b; --muted:#6f829a;
      --teal:#0f766e; --teal-2:#14b8a6; --teal-soft:#e5faf7; --indigo:#4f46e5; --indigo-soft:#eef0ff;
      --green:#15803d; --green-soft:#eaf7ee; --amber:#b45309; --amber-soft:#fff4e4; --rose:#be123c; --rose-soft:#ffe7ed;
      --blue:#2563eb; --blue-soft:#eaf2ff;
      --shadow:0 20px 50px rgba(19, 41, 68, .08); --radius-xl:28px; --radius-lg:20px; --radius-md:16px; --radius-sm:12px;
    }
    *{box-sizing:border-box} html,body{margin:0;padding:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:
      radial-gradient(circle at top left,#e9fbf6 0,transparent 24%),
      radial-gradient(circle at top right,#eef2ff 0,transparent 20%),
      linear-gradient(180deg,#f8fbff 0,#f3f7fb 100%)}
    body{min-height:100vh} button,input,select,textarea{font:inherit}
    .hidden{display:none!important}
    .app{min-height:100vh}
    .login-shell{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;padding:32px;gap:28px}
    .hero,.login-card,.card,.sidebar,.topbar{background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border:1px solid rgba(221,231,242,.95);box-shadow:var(--shadow)}
    .hero{border-radius:36px;padding:36px;display:flex;flex-direction:column;justify-content:space-between}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
    .hero h1{font-size:clamp(34px,5vw,58px);line-height:1.02;margin:18px 0 14px;max-width:12ch}.login-logo{width:min(100%,380px);display:block;filter:drop-shadow(0 20px 45px rgba(15,118,110,.12))}
    .hero p{font-size:16px;line-height:1.75;color:var(--muted);max-width:60ch;margin:0}
    .feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:30px}.brand-wordmark{width:min(100%,260px);display:block}
    .feature{padding:18px;border-radius:22px;background:linear-gradient(180deg,#fff,#f9fbff);border:1px solid #e7eef7}
    .feature strong{display:block;font-size:15px;margin-bottom:6px}.feature span{font-size:13px;color:var(--muted);line-height:1.55}
    .login-wrap{display:flex;align-items:center;justify-content:center}
    .login-card{width:min(100%,540px);border-radius:32px;padding:30px}
    .login-card h2{margin:0;font-size:32px}.login-card p{color:var(--muted);line-height:1.7}
    .field{margin-top:18px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;color:#5e718b}
    .input,.select,.textarea{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;outline:none;color:var(--text);transition:.18s}
    .input:focus,.select:focus,.textarea:focus{border-color:#a7c4e7;box-shadow:0 0 0 4px rgba(79,70,229,.08)} .textarea{min-height:120px;resize:vertical}
    .button{border:0;border-radius:16px;padding:14px 18px;font-weight:700;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:10px}
    .button:hover{transform:translateY(-1px)} .button.primary{background:linear-gradient(135deg,var(--teal),var(--teal-2));color:#fff} .button.secondary{background:#fff;border:1px solid var(--line);color:var(--text)} .button.soft{background:var(--panel-soft);border:1px solid var(--line);color:#334a66}
    .demo-grid{display:grid;gap:12px;margin-top:18px}.demo{padding:16px;border-radius:18px;border:1px solid #e7eef7;background:#fcfeff;cursor:pointer;transition:.18s}.demo:hover{background:#fff;transform:translateY(-1px)}
    .demo-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.mini{display:inline-flex;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800}.mini.student{background:var(--teal-soft);color:var(--teal)}.mini.counselor{background:var(--indigo-soft);color:var(--indigo)}.mini.admin{background:var(--amber-soft);color:var(--amber)}
    .error{margin-top:14px;padding:14px;border-radius:16px;background:var(--rose-soft);color:var(--rose);border:1px solid #ffd1dc;font-size:14px}
    .layout{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
    .sidebar{padding:22px;position:sticky;top:0;height:100vh;border-right:1px solid rgba(221,231,242,.9)}
    .brand{display:flex;gap:14px;align-items:center;padding:14px;border-radius:22px;background:linear-gradient(180deg,#fff,#f8fbff);border:1px solid #e8eef6}
    .brand-logo{width:72px;height:72px;padding:8px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #dfeaf3;overflow:hidden;flex-shrink:0}.brand-logo img{width:100%;height:100%;object-fit:contain}
    .brand h1{font-size:18px;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .nav{margin-top:26px}.nav-label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8ca0b8;padding:0 12px 10px}.nav-btn{width:100%;background:transparent;border:0;display:flex;align-items:center;gap:12px;padding:14px 14px;border-radius:18px;color:#5c6f88;text-align:left;cursor:pointer;margin-bottom:8px;transition:.18s}.nav-btn:hover{background:#f5f9fd;color:var(--text)}.nav-btn.active{background:linear-gradient(135deg,#eafbf7,#f2f6ff);color:var(--teal);font-weight:700;box-shadow:inset 0 0 0 1px rgba(15,118,110,.12)}
    .nav-icon{width:36px;height:36px;border-radius:13px;background:#fff;display:grid;place-items:center;border:1px solid #e8eef6}
    .user-card{margin-top:26px;padding:18px;border-radius:24px;background:linear-gradient(145deg,#0f766e,#115e59);color:#fff}.user-card p{margin:6px 0 0;color:#d7fbf3;font-size:13px}.user-card .button{width:100%;margin-top:16px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18)}
    .main{padding:28px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-radius:26px}
    .search{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);padding:12px 14px;border-radius:16px;min-width:320px}.search input{border:0;outline:none;width:100%;font-size:14px;background:transparent}
    .hero-strip{margin-top:22px;padding:26px;border-radius:30px;background:linear-gradient(135deg,#113d67 0,#0f766e 55%,#1aa692 100%);color:#fff;position:relative;overflow:hidden}
    .hero-strip:after{content:'';position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
    .hero-strip h2{margin:0;font-size:32px}.hero-strip p{color:#ddf6f1;max-width:68ch;line-height:1.7;margin:10px 0 0}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:20px}.card{border-radius:24px;padding:22px}.stat-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.stat-kicker{font-size:13px;color:var(--muted)}.stat-value{font-size:34px;font-weight:800;margin-top:10px}.icon-chip{width:46px;height:46px;border-radius:16px;background:var(--teal-soft);display:grid;place-items:center;color:var(--teal);font-weight:800}
    .content-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:20px}.stack{display:grid;gap:18px}.card h3{margin:0 0 8px;font-size:20px}.sub{color:var(--muted);font-size:14px;line-height:1.7}
    .appointment{padding:18px;border-radius:20px;background:linear-gradient(180deg,#fff,#fbfdff);border:1px solid #e8eef6;margin-top:14px}.appointment-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.appointment h4{margin:0 0 4px;font-size:18px}.meta{display:grid;gap:6px;margin-top:10px}.meta div{font-size:14px;color:#51657e}.meta strong{color:var(--text)} .note{margin-top:12px;color:var(--muted);line-height:1.6;font-size:14px}
    .status{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800}.status.pending{background:var(--amber-soft);color:var(--amber)}.status.approved{background:var(--green-soft);color:var(--green)}.status.rejected{background:var(--rose-soft);color:var(--rose)}.status.rescheduled{background:var(--indigo-soft);color:var(--indigo)}.status.completed{background:#eef4f8;color:#567}.status.cancelled{background:#f7ebef;color:#8f4560}
    .two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.success{padding:14px 16px;border-radius:16px;background:var(--green-soft);color:var(--green);border:1px solid #d7efdf;margin-bottom:14px;font-size:14px}
    .tabs{display:flex;gap:10px;margin-bottom:12px}.tab{border:1px solid var(--line);background:#fff;padding:11px 14px;border-radius:14px;cursor:pointer;font-weight:700;color:#5f728c}.tab.active{background:linear-gradient(135deg,#eafbf7,#f1f6ff);color:var(--teal)}
    .slot-wrap{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.slot{padding:10px 12px;border-radius:999px;background:#f4f8fc;border:1px solid #e2ebf5;color:#4d627c;font-size:13px;font-weight:700}
    .mobile-bar{display:none;position:sticky;top:0;z-index:40;padding:14px 16px;background:rgba(248,251,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(221,231,242,.95)}
    .mobile-shell{display:flex;align-items:center;justify-content:space-between}.mobile-menu{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;cursor:pointer}
    .empty{padding:18px;border-radius:18px;background:#f8fbff;border:1px dashed #d8e6f2;color:var(--muted);text-align:center;margin-top:14px}
    .page-grid{display:grid;gap:18px;margin-top:20px}
    .list-row{display:grid;grid-template-columns:1.4fr .9fr .9fr .8fr;gap:12px;padding:14px 0;border-bottom:1px solid #ebf1f7;font-size:14px;align-items:center}
    .list-row.head{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8ca0b8;padding-top:0}
    .notif{display:flex;gap:14px;padding:16px;border-radius:18px;background:linear-gradient(180deg,#fff,#fbfdff);border:1px solid #e8eef6;margin-top:12px}.notif-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-weight:800;flex:none}
    .profile{display:grid;grid-template-columns:92px 1fr;gap:18px;align-items:center}.avatar{width:92px;height:92px;border-radius:28px;display:grid;place-items:center;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;font-size:32px;font-weight:800}
    .pill{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#f3f7fb;border:1px solid #e2ebf5;color:#5c7088}
    .action-row{display:flex;gap:10px;flex-wrap:wrap}.info{margin:12px 0 0;padding:14px 16px;border-radius:16px;background:var(--blue-soft);color:var(--blue);border:1px solid #d8e5ff;font-size:14px}.remark-box{margin-top:14px;border-top:1px solid #edf2f7;padding-top:14px}.remark-box textarea{min-height:86px}.remark-label{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#7b8faa;margin-bottom:8px}.muted-action{font-size:13px;color:var(--muted);margin-top:6px}
    @media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.content-grid{grid-template-columns:1fr}.login-shell{grid-template-columns:1fr;padding:18px}.hero h1{max-width:none}}
    @media (max-width:860px){.mobile-bar{display:block}.layout{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:67px;bottom:0;height:auto;width:290px;z-index:50;transform:translateX(-105%);transition:.22s}.sidebar.open{transform:translateX(0)}.main{padding:18px}.topbar{flex-direction:column;align-items:stretch}.search{min-width:0;width:100%}.list-row{grid-template-columns:1fr}.list-row.head{display:none}}
    @media (max-width:640px){.stats{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}.feature-grid{grid-template-columns:1fr}.hero,.login-card,.card{border-radius:24px}.hero-strip h2{font-size:26px}.profile{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="mobile-bar hidden" id="mobileBar"><div class="mobile-shell"><div style="display:flex;align-items:center;gap:10px"><img src="assets/app-icon.png" alt="Guidance Point logo" style="width:42px;height:42px;padding:4px;border-radius:14px;border:1px solid #dfeaf3;background:#fff;object-fit:contain"><strong>Guidance Point</strong></div><button class="mobile-menu" onclick="toggleSidebar()">☰ Menu</button></div></div>
  <div id="app" class="app"></div>
<script>
const DEMO_USERS = [
  {role:'student',name:'Benedict Tanghal',email:'student@school.edu',password:'student123'},
  {role:'counselor',name:'Ms. Rivera',email:'counselor@school.edu',password:'counselor123'},
  {role:'admin',name:'Admin Office',email:'admin@school.edu',password:'admin123'}
];
const SLOTS = {
  'Ms. Rivera':['09:00 AM','10:30 AM','02:00 PM'],
  'Mr. Santos':['08:30 AM','01:30 PM','03:00 PM']
};
const INITIAL_APPOINTMENTS = [
  {id:1,student:'Benedict Tanghal',purpose:'Academic Advising',counselor:'Ms. Rivera',date:'2026-04-25',time:'09:00 AM',status:'Pending',note:'Need help with subject planning for next semester.',remark:''},
  {id:2,student:'Angela Cruz',purpose:'Counseling',counselor:'Mr. Santos',date:'2026-04-26',time:'01:30 PM',status:'Approved',note:'Personal concern and stress management.',remark:'Please arrive 10 minutes early.'},
  {id:3,student:'Miguel Reyes',purpose:'Student Support',counselor:'Ms. Rivera',date:'2026-04-27',time:'10:30 AM',status:'Rescheduled',note:'Follow-up for support documents.',remark:'Bring your updated support papers.'}
];
const INITIAL_NOTIFICATIONS = [
  {id:1,title:'Appointment approved',message:'Your academic advising request with Ms. Rivera was approved.',time:'Today · 9:12 AM'},
  {id:2,title:'New booking reminder',message:'Students can now reserve available guidance slots for next week.',time:'Yesterday · 4:20 PM'},
  {id:3,title:'Counselor note',message:'Please bring any supporting forms for your student support consultation.',time:'Yesterday · 10:03 AM'}
];
const NAV = {
  student:[
    {id:'dashboard',label:'Dashboard',icon:'◫'},
    {id:'appointments',label:'My Appointments',icon:'🗂'},
    {id:'schedule',label:'Available Schedule',icon:'🗓'},
    {id:'notifications',label:'Notifications',icon:'🔔'},
    {id:'settings',label:'Settings',icon:'⚙'}
  ],
  counselor:[
    {id:'dashboard',label:'Dashboard',icon:'◫'},
    {id:'appointments',label:'Requests',icon:'🗂'},
    {id:'schedule',label:'Availability',icon:'🗓'},
    {id:'notifications',label:'Notifications',icon:'🔔'},
    {id:'settings',label:'Settings',icon:'⚙'}
  ],
  admin:[
    {id:'dashboard',label:'Dashboard',icon:'◫'},
    {id:'appointments',label:'All Appointments',icon:'🗂'},
    {id:'users',label:'Users',icon:'👥'},
    {id:'notifications',label:'Notifications',icon:'🔔'},
    {id:'settings',label:'Settings',icon:'⚙'}
  ]
};
const state = {
  screen:'login', role:'student', currentUser:null, sidebarOpen:false,
  loginForm:{email:'',password:''}, authError:'', search:'', page:'dashboard',
  appointments:[...INITIAL_APPOINTMENTS], notifications:[...INITIAL_NOTIFICATIONS],
  successMessage:'',
  formError:'',
  editAppointmentId:null,
  remarkDrafts:{},
  form:{ student:'Benedict Tanghal', purpose:'Counseling', counselor:'Ms. Rivera', date:'', time:'09:00 AM', note:'' }
};
const app = document.getElementById('app');
function escapeHtml(v){ return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function statusClass(status){ return String(status).toLowerCase(); }
function stats(){ return { total:state.appointments.length, pending:state.appointments.filter(a=>a.status==='Pending').length, approved:state.appointments.filter(a=>a.status==='Approved').length, counselors:new Set(state.appointments.map(a=>a.counselor)).size }; }
function filteredAppointments(){ const q = state.search.trim().toLowerCase(); return state.appointments.filter(a => !q || [a.student,a.purpose,a.counselor,a.status,a.date,a.time,a.note].join(' ').toLowerCase().includes(q)); }
function currentNav(){ return NAV[state.role] || NAV.student; }
function pageTitle(){ const item = currentNav().find(n=>n.id===state.page); return item ? item.label : 'Dashboard'; }

function getTodayISO(){ const now = new Date(); const offset = now.getTimezoneOffset(); return new Date(now.getTime()-offset*60000).toISOString().slice(0,10); }
function isActiveAppointment(status){ return !['Rejected','Completed','Cancelled'].includes(String(status||'')); }
function getAvailableBookingSlots(counselor, date, ignoreId){
  const base = [...(SLOTS[counselor]||[])];
  if(!date) return base;
  const blocked = new Set(state.appointments.filter(a => a.counselor===counselor && a.date===date && a.id!==ignoreId && isActiveAppointment(a.status)).map(a => a.time));
  return base.filter(slot => !blocked.has(slot));
}
function findStudentConflict(student, date, time, ignoreId){
  return state.appointments.find(a => a.student===student && a.date===date && a.time===time && a.id!==ignoreId && isActiveAppointment(a.status));
}
function getRemarkDraft(id){
  const appt = state.appointments.find(a=>a.id===id);
  return state.remarkDrafts[id] ?? (appt && appt.remark) ?? '';
}
function pageDesc(){
  const map = {
    dashboard:'Overview of appointments, activity, and quick system status.',
    appointments: state.role==='student' ? 'Book new sessions and track your requests in one place.' : state.role==='counselor' ? 'Review and update student requests from your queue.' : 'Review every appointment across the system.',
    schedule: state.role==='student' ? 'Check open guidance time slots before booking.' : 'Manage or review counselor availability.',
    notifications:'Stay updated with confirmations, reminders, and system messages.',
    settings:'Manage profile details and basic system preferences.',
    users:'View the current user list and school roles.'
  };
  return map[state.page] || 'Manage this section of the system.';
}
function renderLogin(){
  document.getElementById('mobileBar').classList.add('hidden');
  return `<div class="login-shell"><section class="hero"><div><span class="badge">Guidance Point</span><img class="login-logo" src="assets/guidance-point-logo.png" alt="Guidance Point logo"><h1>Support booking that feels calm and easy.</h1><p>This website helps students schedule guidance appointments, lets counselors review requests faster, and gives admins a clearer overview of school support activity.</p><div class="feature-grid"><div class="feature"><strong>Better student flow</strong><span>Students can request help without walking around campus or waiting for manual confirmation.</span></div><div class="feature"><strong>Cleaner counselor queue</strong><span>Requests, schedules, and actions stay in one place with less confusion.</span></div><div class="feature"><strong>Organized records</strong><span>Appointments stay visible and easier to track for guidance operations.</span></div><div class="feature"><strong>Gentler interface</strong><span>Balanced spacing, softer contrast, and clearer hierarchy improve usability.</span></div></div></div><div class="feature"><strong>Demo access</strong><span>Use one of the accounts on the right to test the full website flow.</span></div></section><section class="login-wrap"><div class="login-card"><h2>Welcome back</h2><p>Sign in to continue to Guidance Point.</p><div class="field"><label>Email</label><input class="input" value="${escapeHtml(state.loginForm.email)}" oninput="updateLoginForm('email',this.value)" placeholder="Enter your school email"></div><div class="field"><label>Password</label><input class="input" type="password" value="${escapeHtml(state.loginForm.password)}" oninput="updateLoginForm('password',this.value)" placeholder="Enter your password"></div><div class="action-row" style="margin-top:20px"><button class="button primary" style="flex:1" onclick="login()">Sign in</button></div>${state.authError ? `<div class="error">${escapeHtml(state.authError)}</div>` : ''}<div class="demo-grid"><div class="demo" onclick="fillDemo('student@school.edu','student123')"><div class="demo-top"><strong>Student Demo</strong><span class="mini student">Student</span></div><div class="sub">student@school.edu · student123</div></div><div class="demo" onclick="fillDemo('counselor@school.edu','counselor123')"><div class="demo-top"><strong>Counselor Demo</strong><span class="mini counselor">Counselor</span></div><div class="sub">counselor@school.edu · counselor123</div></div><div class="demo" onclick="fillDemo('admin@school.edu','admin123')"><div class="demo-top"><strong>Admin Demo</strong><span class="mini admin">Admin</span></div><div class="sub">admin@school.edu · admin123</div></div></div></div></section></div>`;
}
function renderSidebar(){
  return `<aside class="sidebar ${state.sidebarOpen?'open':''}" id="sidebar"><div class="brand"><div class="brand-logo"><img src="assets/app-icon.png" alt="Guidance Point logo"></div><div><h1>Guidance Point</h1><p>Online appointments</p></div></div><nav class="nav"><div class="nav-label">Navigation</div>${currentNav().map(item=>`<button class="nav-btn ${state.page===item.id?'active':''}" onclick="setPage('${item.id}')"><span class="nav-icon">${item.icon}</span><span>${item.label}</span></button>`).join('')}</nav><div class="user-card"><strong>${escapeHtml(state.currentUser.name)}</strong><p>${escapeHtml(state.role.charAt(0).toUpperCase()+state.role.slice(1))} account</p><button class="button" onclick="logout()">Sign out</button></div></aside>`;
}
function renderTop(){
  return `<header class="topbar"><div><div class="badge">Guidance Point</div><div style="margin-top:10px"><strong style="font-size:22px">${escapeHtml(pageTitle())}</strong><div class="sub">${escapeHtml(pageDesc())}</div></div></div><div class="search"><span>🔎</span><input value="${escapeHtml(state.search)}" oninput="setSearch(this.value)" placeholder="Search appointments, names, status, or dates"></div></header>`;
}
function renderHeroStrip(){
  return `<section class="hero-strip"><h2>Hello, ${escapeHtml(state.currentUser.name)}.</h2><p>${state.role==='student' ? 'Use this portal to book appointments, review schedules, and stay updated on your support requests.' : state.role==='counselor' ? 'Work through student requests, keep an eye on today’s queue, and manage availability more clearly.' : 'Monitor activity across the portal with a cleaner structure and role-based sections.'}</p></section>`;
}
function renderStats(){ const s = stats(); return `<div class="stats"><div class="card"><div class="stat-top"><div><div class="stat-kicker">Total Appointments</div><div class="stat-value">${s.total}</div><div class="sub">All current records</div></div><div class="icon-chip">🗓</div></div></div><div class="card"><div class="stat-top"><div><div class="stat-kicker">Pending Requests</div><div class="stat-value">${s.pending}</div><div class="sub">Awaiting action</div></div><div class="icon-chip">⏳</div></div></div><div class="card"><div class="stat-top"><div><div class="stat-kicker">Approved</div><div class="stat-value">${s.approved}</div><div class="sub">Confirmed schedules</div></div><div class="icon-chip">✓</div></div></div><div class="card"><div class="stat-top"><div><div class="stat-kicker">Active Counselors</div><div class="stat-value">${s.counselors}</div><div class="sub">Counselors in system</div></div><div class="icon-chip">👤</div></div></div></div>`; }
function appointmentCard(a, actions=''){ return `<div class="appointment"><div class="appointment-top"><div><h4>${escapeHtml(a.purpose)}</h4><span class="status ${statusClass(a.status)}">${escapeHtml(a.status)}</span><div class="meta"><div><strong>Student:</strong> ${escapeHtml(a.student)}</div><div><strong>Counselor:</strong> ${escapeHtml(a.counselor)}</div><div><strong>Schedule:</strong> ${escapeHtml(a.date)} • ${escapeHtml(a.time)}</div></div><div class="note">${escapeHtml(a.note)}</div>${a.remark ? `<div class="info"><strong>Counselor Remark:</strong> ${escapeHtml(a.remark)}</div>` : ''}</div><div>${actions}</div></div></div>`; }
function renderDashboard(){
  if(state.role==='student'){
    const mine = state.appointments.filter(a=>a.student===state.currentUser.name);
    return `<div class="content-grid"><section class="card"><h3>Upcoming Support Activity</h3><div class="sub">A quick look at your recent and upcoming appointments.</div>${mine.length ? mine.slice(0,2).map(a=>appointmentCard(a)).join('') : '<div class="empty">No upcoming appointments yet.</div>'}</section><section class="stack"><div class="card"><h3>Quick Actions</h3><div class="sub">Fast ways to move through the portal.</div><div style="display:grid;gap:12px;margin-top:14px"><button class="button primary" onclick="setPage('appointments')">Book new appointment</button><button class="button secondary" onclick="setPage('schedule')">View available slots</button><button class="button secondary" onclick="setPage('notifications')">Open notifications</button></div></div><div class="card"><h3>Student Notes</h3><div class="sub">Current reminders for your support requests.</div><div style="display:grid;gap:10px;margin-top:14px;font-size:14px;color:#5b6f88"><div>• Keep your concern description short but clear.</div><div>• Check the available schedule before booking.</div><div>• Watch for approval or reschedule notifications.</div></div></div></section></div>`;
  }
  if(state.role==='counselor'){
    const mine = filteredAppointments().filter(a=>a.counselor===state.currentUser.name);
    return `<div class="content-grid"><section class="card"><h3>Today’s Request Queue</h3><div class="sub">Latest requests assigned to your dashboard.</div>${mine.length ? mine.slice(0,3).map(a=>appointmentCard(a, `<div class='action-row'><button class='button primary' style='padding:11px 14px' onclick="updateStatus(${a.id},'Approved')">Approve</button><button class='button secondary' style='padding:11px 14px' onclick="updateStatus(${a.id},'Rescheduled')">Reschedule</button></div>`)).join('') : '<div class="empty">No assigned requests found.</div>'}</section><section class="stack"><div class="card"><h3>Quick Actions</h3><div class="sub">Common tasks for reviewing student requests.</div><div style="display:grid;gap:12px;margin-top:14px"><button class="button primary" onclick="setPage('appointments')">Open full request list</button><button class="button secondary" onclick="setPage('schedule')">Review availability</button><button class="button secondary" onclick="setPage('notifications')">Check updates</button></div></div><div class="card"><h3>Guidance Notes</h3><div class="sub">Simple queue reminders.</div><div style="display:grid;gap:10px;margin-top:14px;font-size:14px;color:#5b6f88"><div>• Approve or reschedule requests clearly.</div><div>• Keep open slots visible to students.</div><div>• Review the dashboard before the next day starts.</div></div></div></section></div>`;
  }
  const list = filteredAppointments();
  return `<div class="content-grid"><section class="card"><h3>System Overview</h3><div class="sub">Latest portal activity across all appointment records.</div>${list.length ? list.slice(0,3).map(a=>appointmentCard(a)).join('') : '<div class="empty">No appointment activity yet.</div>'}</section><section class="stack"><div class="card"><h3>Admin Actions</h3><div class="sub">Main controls for this website structure.</div><div style="display:grid;gap:12px;margin-top:14px"><button class="button primary" onclick="setPage('appointments')">Review all appointments</button><button class="button secondary" onclick="setPage('users')">Open users list</button><button class="button secondary" onclick="setPage('notifications')">Review notices</button></div></div><div class="card"><h3>Build Status</h3><div class="sub">This step adds real section-based navigation.</div><div style="display:grid;gap:10px;margin-top:14px;font-size:14px;color:#5b6f88"><div>✓ Role-based login</div><div>✓ Sidebar navigation by role</div><div>✓ Separate pages and sections</div><div>✓ Booking validation and conflict checking</div><div>↻ Database integration next</div></div></div></section></div>`;
}
function renderStudentAppointments(){
  const mine = state.appointments.filter(a=>a.student===state.currentUser.name);
  return `<div class="content-grid"><section class="card"><h3>${state.editAppointmentId ? 'Reschedule Appointment' : 'Book an Appointment'}</h3><div class="sub">${state.editAppointmentId ? 'Update your current appointment request and submit the new preferred schedule.' : 'Submit a request for counseling, academic advising, or student support.'}</div>${state.successMessage ? `<div class="success">${escapeHtml(state.successMessage)}</div>` : ''}${state.editAppointmentId ? `<div class="info">You are editing an existing appointment. Submit the form to send your reschedule request, or <button class="button secondary" style="padding:8px 12px;margin-left:8px" onclick="clearEditAppointment()">Cancel edit</button></div>` : ''}<div class="two-col" style="margin-top:16px"><div class="field" style="margin-top:0;grid-column:1/-1"><label>Purpose</label><select class="select" onchange="updateForm('purpose',this.value)"><option ${state.form.purpose==='Counseling'?'selected':''}>Counseling</option><option ${state.form.purpose==='Academic Advising'?'selected':''}>Academic Advising</option><option ${state.form.purpose==='Student Support'?'selected':''}>Student Support</option></select></div><div class="field" style="margin-top:0"><label>Counselor</label><select class="select" onchange="changeCounselor(this.value)">${Object.keys(SLOTS).map(name=>`<option value="${escapeHtml(name)}" ${state.form.counselor===name?'selected':''}>${escapeHtml(name)}</option>`).join('')}</select></div><div class="field" style="margin-top:0"><label>Date</label><input class="input" type="date" value="${escapeHtml(state.form.date)}" onchange="updateForm('date',this.value)"></div><div class="field" style="margin-top:0"><label>Time Slot</label><select class="select" onchange="updateForm('time',this.value)">${getAvailableBookingSlots(state.form.counselor, state.form.date, state.editAppointmentId).map(slot=>`<option value="${escapeHtml(slot)}" ${state.form.time===slot?'selected':''}>${escapeHtml(slot)}</option>`).join('')}</select></div><div class="field" style="margin-top:0;grid-column:1/-1"><label>Short Description</label><textarea class="textarea" placeholder="Briefly describe your concern..." oninput="updateForm('note',this.value,this)">${escapeHtml(state.form.note)}</textarea></div></div><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button class="button secondary" onclick="resetForm()">Reset</button><button class="button primary" onclick="submitAppointment()">${state.editAppointmentId ? 'Submit Reschedule' : 'Submit Request'}</button></div></section><section class="card"><h3>My Appointments</h3><div class="sub">Track your current and past requests.</div>${mine.length ? mine.map(a=>appointmentCard(a, isActiveAppointment(a.status) ? `<div class='action-row'><button class='button secondary' style='padding:11px 14px' onclick="startReschedule(${a.id})">Request Reschedule</button><button class='button soft' style='padding:11px 14px;color:var(--rose);border-color:#ffd1dc;background:#fff5f7' onclick="cancelAppointment(${a.id})">Cancel</button></div><div class='muted-action'>You can change active appointments from here.</div>` : '')).join('') : '<div class="empty">No appointments yet.</div>'}</section></div>`;
}
function renderCounselorAppointments(){
  const list = filteredAppointments().filter(a=>a.counselor===state.currentUser.name);
  return `<div class="page-grid"><section class="card"><h3>Request Queue</h3><div class="sub">Review student appointments assigned to your counseling queue.</div>${list.length ? list.map(a=>appointmentCard(a, `<div class='remark-box'><label class='remark-label'>Counselor Remark</label><textarea class='textarea' placeholder='Add a note or instruction for the student...' oninput="updateRemarkDraft(${a.id},this.value,this)">${escapeHtml(getRemarkDraft(a.id))}</textarea><div class='action-row' style='margin-top:12px'><button class='button secondary' style='padding:11px 14px' onclick="saveRemark(${a.id})">Save Remark</button><button class='button primary' style='padding:11px 14px' onclick="updateStatus(${a.id},'Approved')">Approve</button><button class='button secondary' style='padding:11px 14px' onclick="updateStatus(${a.id},'Rescheduled')">Reschedule</button><button class='button secondary' style='padding:11px 14px' onclick="completeAppointment(${a.id})">Mark Completed</button><button class='button soft' style='padding:11px 14px;color:var(--rose);border-color:#ffd1dc;background:#fff5f7' onclick="updateStatus(${a.id},'Rejected')">Reject</button></div></div>`)).join('') : '<div class="empty">No matching requests found.</div>'}</section></div>`;
}
function renderAdminAppointments(){
  const list = filteredAppointments();
  return `<div class="page-grid"><section class="card"><h3>All Appointments</h3><div class="sub">Admin-wide view of all appointment activity.</div>${list.length ? list.map(a=>appointmentCard(a)).join('') : '<div class="empty">No appointments found.</div>'}</section></div>`;
}
function renderSchedule(){
  return `<div class="page-grid"><section class="card"><h3>${state.role==='student'?'Available Time Slots':'Current Availability'}</h3><div class="sub">${state.role==='student'?'Review open counselor schedules before booking.':'Preview the guidance schedule currently shown in the system.'}</div>${Object.entries(SLOTS).map(([name,slots])=>`<div class="appointment"><h4 style="margin:0">${escapeHtml(name)}</h4><div class="slot-wrap">${slots.map(slot=>`<span class="slot">${escapeHtml(slot)}</span>`).join('')}</div></div>`).join('')}</section></div>`;
}
function renderNotifications(){
  return `<div class="page-grid"><section class="card"><h3>Notifications</h3><div class="sub">Recent reminders, updates, and appointment messages.</div>${state.notifications.map(n=>`<div class="notif"><div class="notif-icon">🔔</div><div><strong>${escapeHtml(n.title)}</strong><div class="note" style="margin-top:6px">${escapeHtml(n.message)}</div><div class="sub" style="margin-top:8px">${escapeHtml(n.time)}</div></div></div>`).join('')}</section></div>`;
}
function renderUsers(){
  const users = [
    {name:'Benedict Tanghal', role:'Student', email:'student@school.edu', status:'Active'},
    {name:'Ms. Rivera', role:'Counselor', email:'counselor@school.edu', status:'Active'},
    {name:'Admin Office', role:'Admin', email:'admin@school.edu', status:'Active'}
  ];
  return `<div class="page-grid"><section class="card"><h3>User Directory</h3><div class="sub">Starter user list for the admin view.</div><div style="margin-top:18px"><div class="list-row head"><div>Name</div><div>Role</div><div>Email</div><div>Status</div></div>${users.map(u=>`<div class="list-row"><div><strong>${escapeHtml(u.name)}</strong></div><div>${escapeHtml(u.role)}</div><div>${escapeHtml(u.email)}</div><div><span class="pill">${escapeHtml(u.status)}</span></div></div>`).join('')}</div></section></div>`;
}
function renderSettings(){
  return `<div class="content-grid"><section class="card"><h3>Profile Settings</h3><div class="sub">Basic profile information for this demo build.</div><div class="profile" style="margin-top:16px"><div class="avatar">${escapeHtml((state.currentUser.name||'U').charAt(0))}</div><div><strong style="font-size:22px">${escapeHtml(state.currentUser.name)}</strong><div class="sub" style="margin-top:6px">${escapeHtml(state.currentUser.email)}</div><div style="margin-top:10px"><span class="pill">${escapeHtml(state.role.charAt(0).toUpperCase()+state.role.slice(1))}</span></div></div></div><div class="two-col" style="margin-top:18px"><div class="field" style="margin-top:0"><label>Full Name</label><input class="input" value="${escapeHtml(state.currentUser.name)}"></div><div class="field" style="margin-top:0"><label>Email</label><input class="input" value="${escapeHtml(state.currentUser.email)}"></div><div class="field" style="margin-top:0"><label>Password</label><input class="input" type="password" value="demo-password"></div><div class="field" style="margin-top:0"><label>Notification Preference</label><select class="select"><option>In-app only</option><option>Email and in-app</option></select></div></div><div class="action-row" style="margin-top:18px"><button class="button primary">Save Changes</button><button class="button secondary">Cancel</button></div></section><section class="stack"><div class="card"><h3>System Preference Notes</h3><div class="sub">Placeholder settings for the current website version.</div><div style="display:grid;gap:10px;margin-top:14px;font-size:14px;color:#5b6f88"><div>• Profile saving is visual only for now.</div><div>• Authentication is still demo-based.</div><div>• Real user storage comes in the database step.</div></div></div></section></div>`;
}
function renderPage(){
  if(state.page==='dashboard') return renderDashboard();
  if(state.page==='appointments') return state.role==='student' ? renderStudentAppointments() : state.role==='counselor' ? renderCounselorAppointments() : renderAdminAppointments();
  if(state.page==='schedule') return renderSchedule();
  if(state.page==='notifications') return renderNotifications();
  if(state.page==='settings') return renderSettings();
  if(state.page==='users') return renderUsers();
  return renderDashboard();
}
function renderApp(){
  document.getElementById('mobileBar').classList.remove('hidden');
  return `<div class="layout">${renderSidebar()}<main class="main">${renderTop()}${renderHeroStrip()}${renderStats()}${renderPage()}</main></div>`;
}
function render(){ app.innerHTML = state.screen==='login' ? renderLogin() : renderApp(); }
function updateLoginForm(field,val){ state.loginForm[field]=val; }
function fillDemo(email,password){ state.loginForm.email=email; state.loginForm.password=password; state.authError=''; render(); }
function login(){ const email = state.loginForm.email.trim().toLowerCase(); const pw = state.loginForm.password; const user = DEMO_USERS.find(u=>u.email.toLowerCase()===email && u.password===pw); if(!user){ state.authError='Invalid email or password. Use one of the demo accounts to continue.'; render(); return; } state.currentUser={...user}; state.role=user.role; state.page='dashboard'; state.screen='app'; state.sidebarOpen=false; state.authError=''; state.form.student=user.role==='student'?user.name:'Benedict Tanghal'; state.formError=''; state.successMessage=''; render(); }
function logout(){ state.screen='login'; state.currentUser=null; state.role='student'; state.page='dashboard'; state.loginForm={email:'',password:''}; state.authError=''; state.sidebarOpen=false; state.search=''; state.editAppointmentId=null; state.remarkDrafts={}; render(); }
function toggleSidebar(){ state.sidebarOpen=!state.sidebarOpen; const el=document.getElementById('sidebar'); if(el) el.classList.toggle('open', state.sidebarOpen); }
function setSearch(v){ state.search=v; render(); }
function setPage(page){ state.page=page; state.successMessage=''; state.formError=''; state.sidebarOpen=false; render(); }
function updateForm(field,val,el){ state.form[field]=val; state.formError=''; state.successMessage=''; if(field==='note' && el){ return; } render(); }
function changeCounselor(v){ state.form.counselor=v; const slots = getAvailableBookingSlots(v, state.form.date); state.form.time=slots[0]||''; state.formError=''; state.successMessage=''; render(); }
function resetForm(){ state.form={ student:state.currentUser && state.currentUser.role==='student'?state.currentUser.name:'Benedict Tanghal', purpose:'Counseling', counselor:'Ms. Rivera', date:'', time:'09:00 AM', note:'' }; state.editAppointmentId=null; state.formError=''; state.successMessage=''; render(); }
function clearEditAppointment(){ state.editAppointmentId=null; state.successMessage=''; state.formError=''; render(); }
function startReschedule(id){ const appt = state.appointments.find(a=>a.id===id); if(!appt) return; state.editAppointmentId=id; state.page='appointments'; state.form={ student:appt.student, purpose:appt.purpose, counselor:appt.counselor, date:appt.date, time:appt.time, note:appt.note }; state.successMessage=''; state.formError=''; render(); }
function cancelAppointment(id){ state.appointments=state.appointments.map(a=>a.id===id?{...a,status:'Cancelled'}:a); const appt = state.appointments.find(a=>a.id===id); if(appt){ state.notifications.unshift({id:Date.now(), title:'Appointment cancelled', message:`Your ${appt.purpose.toLowerCase()} request on ${appt.date} at ${appt.time} was cancelled.`, time:'Just now'}); state.successMessage='Appointment cancelled successfully.'; } render(); }
function updateRemarkDraft(id,val,el){ state.remarkDrafts[id]=val; if(el){ return; } render(); }
function saveRemark(id){ const remark = String(getRemarkDraft(id)||'').trim(); state.appointments=state.appointments.map(a=>a.id===id?{...a,remark}:a); const appt = state.appointments.find(a=>a.id===id); if(appt){ state.notifications.unshift({id:Date.now(), title:'Counselor remark saved', message:`A counselor remark was added for ${appt.student}'s ${appt.purpose.toLowerCase()} appointment.`, time:'Just now'}); } render(); }
function completeAppointment(id){ const remark = String(getRemarkDraft(id)||'').trim(); state.appointments=state.appointments.map(a=>a.id===id?{...a,status:'Completed',remark}:a); const appt = state.appointments.find(a=>a.id===id); if(appt){ state.notifications.unshift({id:Date.now(), title:'Appointment completed', message:`${appt.purpose} for ${appt.student} was marked as completed.`, time:'Just now'}); } render(); }
function submitAppointment(){ const note = String(state.form.note||'').trim(); const date = state.form.date; const time = state.form.time; const counselor = state.form.counselor; const student = state.currentUser && state.currentUser.role==='student' ? state.currentUser.name : state.form.student; const editingId = state.editAppointmentId; state.formError=''; state.successMessage=''; if(!date || !time || !note){ state.formError='Please complete the required fields first.'; render(); return; } if(date < getTodayISO()){ state.formError='You cannot book an appointment in the past.'; render(); return; } if(note.length < 10){ state.formError='Please provide a slightly clearer description of at least 10 characters.'; render(); return; } const validSlots = getAvailableBookingSlots(counselor, date, editingId); if(!validSlots.includes(time)){ state.formError='That time slot is no longer available. Please choose another open slot.'; const nextOpen = validSlots[0] || ''; state.form.time = nextOpen; render(); return; } const studentConflict = findStudentConflict(student, date, time, editingId); if(studentConflict){ state.formError='You already have another active appointment at that same date and time.'; render(); return; } if(editingId){ state.appointments=state.appointments.map(a=>a.id===editingId?{...a,purpose:state.form.purpose,counselor,date,time,status:'Rescheduled',note}:a); state.successMessage='Reschedule request submitted successfully.'; state.notifications.unshift({id:Date.now(), title:'Reschedule request sent', message:`Your appointment was updated to ${date} at ${time} and is marked as rescheduled.`, time:'Just now'}); state.editAppointmentId=null; } else { state.appointments.unshift({ id:Date.now(), student, purpose:state.form.purpose, counselor, date, time, status:'Pending', note, remark:'' }); state.successMessage='Appointment request submitted successfully.'; state.notifications.unshift({id:Date.now(), title:'New appointment request', message:`Your ${state.form.purpose.toLowerCase()} request for ${date} at ${time} was submitted and is now pending review.`, time:'Just now'}); } state.form={ student, purpose:'Counseling', counselor:'Ms. Rivera', date:'', time:'09:00 AM', note:'' }; render(); }
function updateStatus(id,status){ const remark = String(getRemarkDraft(id)||'').trim(); state.appointments=state.appointments.map(a=>a.id===id?{...a,status,remark:remark || a.remark || ''}:a); const appt = state.appointments.find(a=>a.id===id); if(appt){ state.notifications.unshift({id:Date.now(), title:'Appointment updated', message:`${appt.purpose} for ${appt.student} is now ${status.toLowerCase()}.`, time:'Just now'}); } render(); }
window.updateLoginForm=updateLoginForm; window.fillDemo=fillDemo; window.login=login; window.logout=logout; window.toggleSidebar=toggleSidebar; window.setSearch=setSearch; window.setPage=setPage; window.updateForm=updateForm; window.changeCounselor=changeCounselor; window.resetForm=resetForm; window.clearEditAppointment=clearEditAppointment; window.startReschedule=startReschedule; window.cancelAppointment=cancelAppointment; window.updateRemarkDraft=updateRemarkDraft; window.saveRemark=saveRemark; window.completeAppointment=completeAppointment; window.submitAppointment=submitAppointment; window.updateStatus=updateStatus;
render();
</script>
</body>
