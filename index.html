<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guidance Appointment System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f4f7fb; --panel:#ffffff; --panel-soft:#f8fbff; --line:#dde7f2; --text:#17304b; --muted:#6f829a;
      --teal:#0f766e; --teal-2:#14b8a6; --teal-soft:#e5faf7; --indigo:#4f46e5; --indigo-soft:#eef0ff;
      --green:#15803d; --green-soft:#eaf7ee; --amber:#b45309; --amber-soft:#fff4e4; --rose:#be123c; --rose-soft:#ffe7ed;
      --shadow:0 20px 50px rgba(19, 41, 68, .08); --radius-xl:28px; --radius-lg:20px; --radius-md:16px; --radius-sm:12px;
    }
    *{box-sizing:border-box} html,body{margin:0;padding:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:
      radial-gradient(circle at top left,#e9fbf6 0,transparent 24%),
      radial-gradient(circle at top right,#eef2ff 0,transparent 20%),
      linear-gradient(180deg,#f8fbff 0,#f3f7fb 100%)}
    body{min-height:100vh} button,input,select,textarea{font:inherit}
    .hidden{display:none!important}
    .app{min-height:100vh}
    .login-shell{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;padding:32px;gap:28px}
    .hero,.login-card,.card,.sidebar,.topbar{background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border:1px solid rgba(221,231,242,.95);box-shadow:var(--shadow)}
    .hero{border-radius:36px;padding:36px;display:flex;flex-direction:column;justify-content:space-between}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
    .hero h1{font-size:clamp(34px,5vw,58px);line-height:1.02;margin:18px 0 14px;max-width:12ch}
    .hero p{font-size:16px;line-height:1.75;color:var(--muted);max-width:60ch;margin:0}
    .feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:30px}
    .feature{padding:18px;border-radius:22px;background:linear-gradient(180deg,#fff,#f9fbff);border:1px solid #e7eef7}
    .feature strong{display:block;font-size:15px;margin-bottom:6px}.feature span{font-size:13px;color:var(--muted);line-height:1.55}
    .login-wrap{display:flex;align-items:center;justify-content:center}
    .login-card{width:min(100%,540px);border-radius:32px;padding:30px}
    .login-card h2{margin:0;font-size:32px}.login-card p{color:var(--muted);line-height:1.7}
    .field{margin-top:18px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;color:#5e718b}
    .input,.select,.textarea{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;outline:none;color:var(--text);transition:.18s}
    .input:focus,.select:focus,.textarea:focus{border-color:#a7c4e7;box-shadow:0 0 0 4px rgba(79,70,229,.08)} .textarea{min-height:120px;resize:vertical}
    .button{border:0;border-radius:16px;padding:14px 18px;font-weight:700;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:10px}
    .button:hover{transform:translateY(-1px)} .button.primary{background:linear-gradient(135deg,var(--teal),var(--teal-2));color:#fff} .button.secondary{background:#fff;border:1px solid var(--line);color:var(--text)} .button.soft{background:var(--panel-soft);border:1px solid var(--line);color:#334a66}
    .demo-grid{display:grid;gap:12px;margin-top:18px}.demo{padding:16px;border-radius:18px;border:1px solid #e7eef7;background:#fcfeff;cursor:pointer;transition:.18s}.demo:hover{background:#fff;transform:translateY(-1px)}
    .demo-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.mini{display:inline-flex;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800}.mini.student{background:var(--teal-soft);color:var(--teal)}.mini.counselor{background:var(--indigo-soft);color:var(--indigo)}.mini.admin{background:var(--amber-soft);color:var(--amber)}
    .error{margin-top:14px;padding:14px;border-radius:16px;background:var(--rose-soft);color:var(--rose);border:1px solid #ffd1dc;font-size:14px}
    .layout{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
    .sidebar{padding:22px;position:sticky;top:0;height:100vh;border-right:1px solid rgba(221,231,242,.9)}
    .brand{display:flex;gap:14px;align-items:center;padding:14px;border-radius:22px;background:linear-gradient(180deg,#fff,#f8fbff);border:1px solid #e8eef6}
    .brand-logo{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--teal-2));color:#fff;font-size:24px;font-weight:800}
    .brand h1{font-size:18px;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .nav{margin-top:26px}.nav-label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8ca0b8;padding:0 12px 10px}.nav-btn{width:100%;background:transparent;border:0;display:flex;align-items:center;gap:12px;padding:14px 14px;border-radius:18px;color:#5c6f88;text-align:left;cursor:pointer;margin-bottom:8px;transition:.18s}.nav-btn:hover{background:#f5f9fd;color:var(--text)}.nav-btn.active{background:linear-gradient(135deg,#eafbf7,#f2f6ff);color:var(--teal);font-weight:700;box-shadow:inset 0 0 0 1px rgba(15,118,110,.12)}
    .nav-icon{width:36px;height:36px;border-radius:13px;background:#fff;display:grid;place-items:center;border:1px solid #e8eef6}
    .user-card{margin-top:26px;padding:18px;border-radius:24px;background:linear-gradient(145deg,#0f766e,#115e59);color:#fff}.user-card p{margin:6px 0 0;color:#d7fbf3;font-size:13px}.user-card .button{width:100%;margin-top:16px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18)}
    .main{padding:28px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-radius:26px}
    .search{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);padding:12px 14px;border-radius:16px;min-width:320px}.search input{border:0;outline:none;width:100%;font-size:14px;background:transparent}
    .hero-strip{margin-top:22px;padding:26px;border-radius:30px;background:linear-gradient(135deg,#113d67 0,#0f766e 55%,#1aa692 100%);color:#fff;position:relative;overflow:hidden}
    .hero-strip:after{content:'';position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
    .hero-strip h2{margin:0;font-size:32px}.hero-strip p{color:#ddf6f1;max-width:68ch;line-height:1.7;margin:10px 0 0}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:20px}.card{border-radius:24px;padding:22px}.stat-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.stat-kicker{font-size:13px;color:var(--muted)}.stat-value{font-size:34px;font-weight:800;margin-top:10px}.icon-chip{width:46px;height:46px;border-radius:16px;background:var(--teal-soft);display:grid;place-items:center;color:var(--teal);font-weight:800}
    .content-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:20px}.stack{display:grid;gap:18px}.card h3{margin:0 0 8px;font-size:20px}.sub{color:var(--muted);font-size:14px;line-height:1.7}
    .appointment{padding:18px;border-radius:20px;background:linear-gradient(180deg,#fff,#fbfdff);border:1px solid #e8eef6;margin-top:14px}.appointment-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.appointment h4{margin:0 0 4px;font-size:18px}.meta{display:grid;gap:6px;margin-top:10px}.meta div{font-size:14px;color:#51657e}.meta strong{color:var(--text)} .note{margin-top:12px;color:var(--muted);line-height:1.6;font-size:14px}
    .status{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800}.status.pending{background:var(--amber-soft);color:var(--amber)}.status.approved{background:var(--green-soft);color:var(--green)}.status.rejected{background:var(--rose-soft);color:var(--rose)}.status.rescheduled{background:var(--indigo-soft);color:var(--indigo)}.status.completed{background:#eef4f8;color:#567}
    .two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.success{padding:14px 16px;border-radius:16px;background:var(--green-soft);color:var(--green);border:1px solid #d7efdf;margin-bottom:14px;font-size:14px}
    .tabs{display:flex;gap:10px;margin-bottom:12px}.tab{border:1px solid var(--line);background:#fff;padding:11px 14px;border-radius:14px;cursor:pointer;font-weight:700;color:#5f728c}.tab.active{background:linear-gradient(135deg,#eafbf7,#f1f6ff);color:var(--teal)}
    .slot-wrap{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.slot{padding:10px 12px;border-radius:999px;background:#f4f8fc;border:1px solid #e2ebf5;color:#4d627c;font-size:13px;font-weight:700}
    .mobile-bar{display:none;position:sticky;top:0;z-index:40;padding:14px 16px;background:rgba(248,251,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(221,231,242,.95)}
    .mobile-shell{display:flex;align-items:center;justify-content:space-between}.mobile-menu{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;cursor:pointer}
    .empty{padding:18px;border-radius:18px;background:#f8fbff;border:1px dashed #d8e6f2;color:var(--muted);text-align:center;margin-top:14px}
    @media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.content-grid{grid-template-columns:1fr}.login-shell{grid-template-columns:1fr;padding:18px}.hero h1{max-width:none}}
    @media (max-width:860px){.mobile-bar{display:block}.layout{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:67px;bottom:0;width:min(86vw,310px);height:auto;transform:translateX(-110%);transition:.22s;z-index:50;border-right:1px solid var(--line)}.sidebar.open{transform:none}.main{padding:18px}.topbar{display:block}.search{margin-top:14px;min-width:0;width:100%}}
    @media (max-width:640px){.stats,.two-col,.feature-grid{grid-template-columns:1fr}.hero-strip h2{font-size:26px}.login-card{padding:22px}.appointment-top{flex-direction:column}.search{padding:11px 12px}}
  </style>
</head>
<body>
<div class="mobile-bar hidden" id="mobileBar">
  <div class="mobile-shell">
    <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
    <strong>Guidance Appointment System</strong>
    <button class="mobile-menu" onclick="logout()">↩</button>
  </div>
</div>
<div id="app" class="app"></div>
<script>
const DEMO_USERS = [
  { role:'student', name:'Benedict Tanghal', email:'student@school.edu', password:'student123', badge:'Student' },
  { role:'counselor', name:'Ms. Rivera', email:'counselor@school.edu', password:'counselor123', badge:'Counselor' },
  { role:'admin', name:'Admin Office', email:'admin@school.edu', password:'admin123', badge:'Admin' }
];
const INITIAL_APPOINTMENTS = [
  { id:1, student:'Benedict Tanghal', purpose:'Academic Advising', counselor:'Ms. Rivera', date:'2026-04-25', time:'09:00 AM', status:'Pending', note:'Need help with subject planning for next semester.' },
  { id:2, student:'Angela Cruz', purpose:'Counseling', counselor:'Mr. Santos', date:'2026-04-26', time:'01:30 PM', status:'Approved', note:'Personal concern and stress management.' },
  { id:3, student:'Miguel Reyes', purpose:'Student Support', counselor:'Ms. Rivera', date:'2026-04-27', time:'10:30 AM', status:'Rescheduled', note:'Follow-up for support documents.' }
];
const SLOTS = { 'Ms. Rivera':['09:00 AM','10:30 AM','02:00 PM'], 'Mr. Santos':['08:30 AM','01:30 PM','03:00 PM'] };
const state = {
  screen:'login', role:'student', currentUser:null, authError:'', search:'', sidebarOpen:false,
  appointments: JSON.parse(JSON.stringify(INITIAL_APPOINTMENTS)),
  form:{ student:'Benedict Tanghal', purpose:'Counseling', counselor:'Ms. Rivera', date:'', time:'09:00 AM', note:'' },
  loginForm:{ email:'', password:'' }, successMessage:'', counselorTab:'requests'
};
const app = document.getElementById('app');
const escapeHtml = (s='') => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function filteredAppointments(){ const q=state.search.trim().toLowerCase(); if(!q) return state.appointments; return state.appointments.filter(a=>[a.student,a.purpose,a.counselor,a.date,a.time,a.status,a.note].join(' ').toLowerCase().includes(q)); }
function stats(){ return { total:state.appointments.length, pending:state.appointments.filter(a=>a.status==='Pending').length, approved:state.appointments.filter(a=>a.status==='Approved').length, counselors:new Set(state.appointments.map(a=>a.counselor)).size }; }
function statusClass(s){ return (s||'').toLowerCase(); }
function renderLogin(){
  document.getElementById('mobileBar').classList.add('hidden');
  return `
    <div class="login-shell">
      <section class="hero">
        <div>
          <span class="badge">Guidance Appointment System</span>
          <h1>Private, organized support for every student.</h1>
          <p>This standalone build fixes the broken version and starts the system with a real sign-in flow. Students can request appointments, counselors can manage requests, and admins can monitor the whole portal using a calmer, more thoughtful interface.</p>
          <div class="feature-grid">
            <div class="feature"><strong>Student booking</strong><span>Simple appointment requests with clearer form sections and less visual noise.</span></div>
            <div class="feature"><strong>Counselor workflow</strong><span>Review, approve, reject, or reschedule requests in one focused dashboard.</span></div>
            <div class="feature"><strong>Admin visibility</strong><span>See records, activity, and overall system health in one place.</span></div>
            <div class="feature"><strong>Softer interface</strong><span>Better spacing, color balance, typography, and mobile responsiveness.</span></div>
          </div>
        </div>
        <div class="feature"><strong>Demo access</strong><span>Use any demo account on the right to enter instantly. This makes the next system features easier to build on a proper structure.</span></div>
      </section>
      <section class="login-wrap">
        <div class="login-card">
          <h2>Sign in</h2>
          <p>Access the correct dashboard based on your school role.</p>
          ${state.authError ? `<div class="error">${escapeHtml(state.authError)}</div>` : ''}
          <div class="field"><label>Email</label><input class="input" type="email" placeholder="name@school.edu" value="${escapeHtml(state.loginForm.email)}" oninput="updateLoginForm('email',this.value)"></div>
          <div class="field"><label>Password</label><input class="input" type="password" placeholder="Enter password" value="${escapeHtml(state.loginForm.password)}" oninput="updateLoginForm('password',this.value)"></div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px"><div style="color:var(--muted);font-size:13px">Role-based access enabled</div><button class="button primary" onclick="login()">Sign In</button></div>
          <div class="demo-grid">
            ${DEMO_USERS.map(u=>`<div class="demo" onclick="fillDemo('${u.email}','${u.password}')"><div class="demo-top"><strong>${escapeHtml(u.name)}</strong><span class="mini ${u.role}">${escapeHtml(u.badge)}</span></div><div style="margin-top:8px;color:var(--muted);font-size:13px">${escapeHtml(u.email)}</div><div style="margin-top:4px;color:#8aa;font-size:12px">Tap to autofill credentials</div></div>`).join('')}
          </div>
        </div>
      </section>
    </div>`;
}
function renderSidebar(){
  return `<aside class="sidebar ${state.sidebarOpen ? 'open' : ''}" id="sidebar">
    <div class="brand"><div class="brand-logo">G</div><div><h1>Guidance Appoint</h1><p>School Support Portal</p></div></div>
    <div class="nav"><div class="nav-label">Workspace</div>
      <button class="nav-btn active"><span class="nav-icon">◫</span>Dashboard</button>
      <button class="nav-btn"><span class="nav-icon">☰</span>Appointments</button>
      <button class="nav-btn"><span class="nav-icon">🗓</span>Schedule</button>
      <button class="nav-btn"><span class="nav-icon">🔔</span>Notifications</button>
      <button class="nav-btn"><span class="nav-icon">⚙</span>Settings</button>
    </div>
    <div class="user-card"><strong>${escapeHtml(state.currentUser.name)}</strong><p>${escapeHtml(state.currentUser.badge)} account currently active</p><button class="button" onclick="logout()">Sign Out</button></div>
  </aside>`;
}
function renderTop(){
  const title = state.role === 'student' ? 'Student Dashboard' : state.role === 'counselor' ? 'Counselor Dashboard' : 'Admin Dashboard';
  return `<div class="topbar"><div><div style="font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)">Guidance Appointment System</div><div style="font-size:30px;font-weight:800;margin-top:6px">${title}</div><div class="sub" style="margin-top:8px">A clearer and more comfortable system for booking counseling, advising, and support appointments.</div></div><div class="search"><span>⌕</span><input placeholder="Search appointments" value="${escapeHtml(state.search)}" oninput="setSearch(this.value)"></div></div>`;
}
function renderHeroStrip(){
  return `<section class="hero-strip"><h2>Welcome back, ${escapeHtml(state.currentUser.name)}.</h2><p>${state.role==='student' ? 'Book appointments, track your request status, and reach support services without the usual friction.' : state.role==='counselor' ? 'Review student requests, manage availability, and respond faster with a simpler workflow.' : 'Monitor appointments, user activity, and future system actions from one organized admin view.'}</p></section>`;
}
function renderStats(){ const s = stats(); return `<div class="stats">
  <div class="card"><div class="stat-top"><div><div class="stat-kicker">Total Appointments</div><div class="stat-value">${s.total}</div><div class="sub">All current records</div></div><div class="icon-chip">🗓</div></div></div>
  <div class="card"><div class="stat-top"><div><div class="stat-kicker">Pending Requests</div><div class="stat-value">${s.pending}</div><div class="sub">Awaiting action</div></div><div class="icon-chip">⏳</div></div></div>
  <div class="card"><div class="stat-top"><div><div class="stat-kicker">Approved</div><div class="stat-value">${s.approved}</div><div class="sub">Confirmed schedules</div></div><div class="icon-chip">✓</div></div></div>
  <div class="card"><div class="stat-top"><div><div class="stat-kicker">Active Counselors</div><div class="stat-value">${s.counselors}</div><div class="sub">Counselors in system</div></div><div class="icon-chip">👤</div></div></div>
</div>`; }
function appointmentCard(a, actions=''){ return `<div class="appointment"><div class="appointment-top"><div><h4>${escapeHtml(a.purpose)}</h4><span class="status ${statusClass(a.status)}">${escapeHtml(a.status)}</span><div class="meta"><div><strong>Student:</strong> ${escapeHtml(a.student)}</div><div><strong>Counselor:</strong> ${escapeHtml(a.counselor)}</div><div><strong>Schedule:</strong> ${escapeHtml(a.date)} • ${escapeHtml(a.time)}</div></div><div class="note">${escapeHtml(a.note)}</div></div><div>${actions}</div></div></div>`; }
function renderStudent(){
  const mine = state.appointments.filter(a=>a.student==='Benedict Tanghal');
  return `<div class="content-grid"><section class="card"><h3>Book an Appointment</h3><div class="sub">Submit a request for counseling, academic advising, or student support.</div>${state.successMessage ? `<div class="success">${escapeHtml(state.successMessage)}</div>` : ''}
    <div class="two-col" style="margin-top:16px">
      <div class="field" style="margin-top:0;grid-column:1/-1"><label>Purpose</label><select class="select" onchange="updateForm('purpose',this.value)"><option ${state.form.purpose==='Counseling'?'selected':''}>Counseling</option><option ${state.form.purpose==='Academic Advising'?'selected':''}>Academic Advising</option><option ${state.form.purpose==='Student Support'?'selected':''}>Student Support</option></select></div>
      <div class="field" style="margin-top:0"><label>Counselor</label><select class="select" onchange="changeCounselor(this.value)">${Object.keys(SLOTS).map(name=>`<option value="${escapeHtml(name)}" ${state.form.counselor===name?'selected':''}>${escapeHtml(name)}</option>`).join('')}</select></div>
      <div class="field" style="margin-top:0"><label>Date</label><input class="input" type="date" value="${escapeHtml(state.form.date)}" onchange="updateForm('date',this.value)"></div>
      <div class="field" style="margin-top:0"><label>Time Slot</label><select class="select" onchange="updateForm('time',this.value)">${(SLOTS[state.form.counselor]||[]).map(slot=>`<option value="${escapeHtml(slot)}" ${state.form.time===slot?'selected':''}>${escapeHtml(slot)}</option>`).join('')}</select></div>
      <div class="field" style="margin-top:0;grid-column:1/-1"><label>Short Description</label><textarea class="textarea" placeholder="Briefly describe your concern..." oninput="updateForm('note',this.value)">${escapeHtml(state.form.note)}</textarea></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button class="button secondary" onclick="resetForm()">Reset</button><button class="button primary" onclick="submitAppointment()">Submit Request</button></div>
  </section>
  <section class="card"><h3>My Appointments</h3><div class="sub">Track your current and past requests.</div>${mine.length ? mine.map(a=>appointmentCard(a)).join('') : '<div class="empty">No appointments yet.</div>'}</section></div>`;
}
function renderCounselor(){
  const list = filteredAppointments().filter(a=>a.counselor==='Ms. Rivera');
  return `<div class="card"><div class="tabs"><button class="tab ${state.counselorTab==='requests'?'active':''}" onclick="setCounselorTab('requests')">Requests</button><button class="tab ${state.counselorTab==='schedule'?'active':''}" onclick="setCounselorTab('schedule')">Schedule</button></div>
  ${state.counselorTab==='requests' ? `${list.length ? list.map(a=>appointmentCard(a, `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class='button primary' style='padding:11px 14px' onclick="updateStatus(${a.id},'Approved')">Approve</button><button class='button secondary' style='padding:11px 14px' onclick="updateStatus(${a.id},'Rescheduled')">Reschedule</button><button class='button soft' style='padding:11px 14px;color:var(--rose);border-color:#ffd1dc;background:#fff5f7' onclick="updateStatus(${a.id},'Rejected')">Reject</button></div>`)).join('') : '<div class="empty">No matching requests found.</div>'}` : `${Object.entries(SLOTS).map(([name,slots])=>`<div class="appointment"><h4 style='margin:0'>${escapeHtml(name)}</h4><div class="slot-wrap">${slots.map(slot=>`<span class="slot">${escapeHtml(slot)}</span>`).join('')}</div></div>`).join('')}`}
  </div>`;
}
function renderAdmin(){
  const list = filteredAppointments();
  return `<div class="content-grid"><section class="card"><h3>Appointment Overview</h3><div class="sub">Admin-wide view of all appointment activity.</div>${list.length ? list.map(a=>appointmentCard(a)).join('') : '<div class="empty">No appointments found.</div>'}</section>
  <section class="stack"><div class="card"><h3>Quick Actions</h3><div class="sub">Planned admin controls for the next builds.</div><div style="display:grid;gap:12px;margin-top:14px"><button class="button primary" style="justify-content:flex-start">Add Counselor</button><button class="button secondary" style="justify-content:flex-start">Manage Concern Types</button><button class="button secondary" style="justify-content:flex-start">View Reports</button><button class="button secondary" style="justify-content:flex-start">Export Appointments</button></div></div>
  <div class="card"><h3>System Notes</h3><div class="sub">Current scope of this fixed website build.</div><div style="display:grid;gap:10px;margin-top:14px;font-size:14px;color:#5b6f88"><div>✓ Student booking form</div><div>✓ Role-based login flow</div><div>✓ Counselor approval actions</div><div>↻ Database integration next</div><div>↻ Notifications later</div><div>⚠ Demo authentication only</div></div></div></section></div>`;
}
function renderApp(){
  document.getElementById('mobileBar').classList.remove('hidden');
  return `<div class="layout">${renderSidebar()}<main class="main">${renderTop()}${renderHeroStrip()}${renderStats()}${state.role==='student'?renderStudent():state.role==='counselor'?renderCounselor():renderAdmin()}</main></div>`;
}
function render(){ app.innerHTML = state.screen==='login' ? renderLogin() : renderApp(); }
function updateLoginForm(field,val){ state.loginForm[field]=val; }
function fillDemo(email,password){ state.loginForm.email=email; state.loginForm.password=password; state.authError=''; render(); }
function login(){ const email = state.loginForm.email.trim().toLowerCase(); const pw = state.loginForm.password; const user = DEMO_USERS.find(u=>u.email.toLowerCase()===email && u.password===pw); if(!user){ state.authError='Invalid email or password. Use one of the demo accounts to continue.'; render(); return; } state.currentUser={...user}; state.role=user.role; state.screen='app'; state.sidebarOpen=false; state.authError=''; state.form.student=user.role==='student'?user.name:'Benedict Tanghal'; render(); }
function logout(){ state.screen='login'; state.currentUser=null; state.role='student'; state.loginForm={email:'',password:''}; state.authError=''; state.sidebarOpen=false; render(); }
function toggleSidebar(){ state.sidebarOpen=!state.sidebarOpen; const el=document.getElementById('sidebar'); if(el) el.classList.toggle('open', state.sidebarOpen); }
function setSearch(v){ state.search=v; render(); }
function updateForm(field,val){ state.form[field]=val; }
function changeCounselor(v){ state.form.counselor=v; state.form.time=(SLOTS[v]||[])[0]||''; render(); }
function resetForm(){ state.form={ student:'Benedict Tanghal', purpose:'Counseling', counselor:'Ms. Rivera', date:'', time:'09:00 AM', note:'' }; state.successMessage=''; render(); }
function submitAppointment(){ if(!state.form.date || !state.form.time || !String(state.form.note).trim()){ alert('Please complete the required fields first.'); return; } state.appointments.unshift({ id:Date.now(), student:state.form.student, purpose:state.form.purpose, counselor:state.form.counselor, date:state.form.date, time:state.form.time, status:'Pending', note:String(state.form.note).trim() }); state.successMessage='Appointment request submitted successfully.'; resetForm(); state.successMessage='Appointment request submitted successfully.'; render(); }
function updateStatus(id,status){ state.appointments=state.appointments.map(a=>a.id===id?{...a,status}:a); render(); }
function setCounselorTab(tab){ state.counselorTab=tab; render(); }
window.updateLoginForm=updateLoginForm; window.fillDemo=fillDemo; window.login=login; window.logout=logout; window.toggleSidebar=toggleSidebar; window.setSearch=setSearch; window.updateForm=updateForm; window.changeCounselor=changeCounselor; window.resetForm=resetForm; window.submitAppointment=submitAppointment; window.updateStatus=updateStatus; window.setCounselorTab=setCounselorTab;
render();
</script>
</body>
</html>
