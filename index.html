<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guidance Appointment System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: rgba(255,255,255,0.88);
      --surface-strong: #ffffff;
      --surface-soft: #f8fbff;
      --text: #10233f;
      --muted: #6a7a93;
      --line: #dbe6f2;
      --primary: #0f766e;
      --primary-soft: #dff7f3;
      --primary-strong: #0b5f59;
      --accent: #4f46e5;
      --accent-soft: #ecebff;
      --success: #15803d;
      --success-soft: #e8f7ee;
      --warning: #b45309;
      --warning-soft: #fff3e2;
      --danger: #be123c;
      --danger-soft: #ffe4ea;
      --shadow: 0 20px 50px rgba(20, 43, 74, 0.08);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; background:
      radial-gradient(circle at top left, #ecfdf5 0%, transparent 22%),
      radial-gradient(circle at top right, #eef2ff 0%, transparent 18%),
      linear-gradient(180deg, #f8fbff 0%, #f3f7fb 100%);
      color: var(--text); }
    body { min-height: 100vh; }
    button, input, select, textarea { font: inherit; }

    .app-shell {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 28px 22px;
      border-right: 1px solid rgba(219,230,242,0.9);
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 14px;
      border-radius: 22px;
      background: linear-gradient(135deg, #ffffff 0%, #f5fbfb 100%);
      border: 1px solid #e4eef6;
      box-shadow: var(--shadow);
    }

    .brand-logo {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%);
      color: white;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .nav-group { margin-top: 28px; }
    .nav-label {
      color: #8ea0b9;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0 14px;
      margin-bottom: 10px;
    }
    .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 18px;
      color: #5b6d86;
      cursor: pointer;
      transition: 0.18s ease;
      text-align: left;
      margin-bottom: 8px;
    }
    .nav-item:hover {
      background: #f6f9fc;
      color: var(--text);
      transform: translateX(2px);
    }
    .nav-item.active {
      background: linear-gradient(135deg, #e8fbf7 0%, #f1f8ff 100%);
      color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(15,118,110,0.12);
      font-weight: 700;
    }
    .nav-icon {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.95);
      box-shadow: inset 0 0 0 1px #e8eef5;
      font-size: 16px;
    }

    .role-card {
      margin-top: 26px;
      padding: 18px;
      border-radius: 24px;
      background: linear-gradient(145deg, #0f766e 0%, #115e59 100%);
      color: white;
      box-shadow: 0 18px 40px rgba(15,118,110,0.24);
    }
    .role-card h3 { margin: 0 0 6px; font-size: 18px; }
    .role-card p { margin: 0 0 12px; color: rgba(255,255,255,0.82); font-size: 13px; line-height: 1.5; }
    .role-card select {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.12);
      color: white;
      border-radius: 14px;
      padding: 12px 14px;
      outline: none;
    }
    .role-card select option { color: #10233f; }

    .content {
      padding: 30px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 24px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(15,118,110,0.1);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .hero h2 { margin: 14px 0 10px; font-size: 38px; line-height: 1.08; letter-spacing: -0.03em; }
    .hero p { margin: 0; color: var(--muted); max-width: 780px; line-height: 1.7; }

    .top-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .searchbox, .ghost-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 18px;
      background: rgba(255,255,255,0.9);
      border: 1px solid #e4edf7;
      padding: 12px 14px;
      box-shadow: var(--shadow);
    }
    .searchbox input {
      border: 0;
      outline: none;
      background: transparent;
      min-width: 230px;
      color: var(--text);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid rgba(227,235,245,0.95);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      border-radius: var(--radius-xl);
      padding: 22px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::after {
      content: "";
      position: absolute;
      right: -20px;
      top: -20px;
      width: 92px;
      height: 92px;
      background: radial-gradient(circle, rgba(15,118,110,0.10) 0%, rgba(15,118,110,0) 72%);
      pointer-events: none;
    }
    .stat-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
    }
    .stat-title {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
      font-weight: 600;
    }
    .stat-value {
      margin: 14px 0 8px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .stat-sub { color: var(--muted); font-size: 13px; }
    .icon-chip {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 20px;
    }

    .main-grid {
      display: grid;
      gap: 18px;
    }
    .main-grid.two-col {
      grid-template-columns: 1.1fr 0.9fr;
    }
    .main-grid.admin {
      grid-template-columns: 1.2fr 0.8fr;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(227,235,245,0.95);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      border-radius: var(--radius-xl);
      padding: 24px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    .card h3 {
      margin: 0;
      font-size: 21px;
      letter-spacing: -0.02em;
    }
    .card .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 13px; font-weight: 700; color: #47576f; }
    .field input,
    .field select,
    .field textarea {
      border: 1px solid #d8e4ef;
      background: #fbfdff;
      color: var(--text);
      border-radius: 16px;
      padding: 14px 15px;
      outline: none;
      transition: 0.18s ease;
      resize: vertical;
      min-height: 52px;
    }
    .field textarea { min-height: 130px; }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: rgba(15,118,110,0.45);
      box-shadow: 0 0 0 4px rgba(15,118,110,0.10);
      background: white;
    }

    .button-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .btn {
      border: 0;
      border-radius: 16px;
      padding: 13px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
      color: white;
      box-shadow: 0 14px 30px rgba(15,118,110,0.22);
    }
    .btn-secondary {
      background: white;
      color: #38506b;
      border: 1px solid #d9e4ef;
    }
    .btn-success { background: var(--success-soft); color: var(--success); }
    .btn-warning { background: var(--warning-soft); color: var(--warning); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); }
    .btn-sm { padding: 10px 14px; border-radius: 14px; font-size: 13px; }

    .banner-success {
      margin-bottom: 16px;
      padding: 16px 18px;
      border-radius: 18px;
      background: linear-gradient(135deg, #eaf9ef 0%, #f5fffb 100%);
      border: 1px solid #d4f0dd;
      color: #166534;
      font-weight: 600;
    }

    .appointments-list { display: grid; gap: 14px; }
    .appointment-card {
      border-radius: 22px;
      border: 1px solid #e3ebf4;
      background: linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(248,251,255,0.98) 100%);
      padding: 18px;
      transition: 0.18s ease;
    }
    .appointment-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 32px rgba(22, 45, 78, 0.08);
    }
    .appointment-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .appointment-title { margin: 0; font-size: 18px; }
    .appointment-note { color: var(--muted); line-height: 1.6; font-size: 14px; }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0 0;
    }
    .meta-box {
      padding: 12px 13px;
      border-radius: 16px;
      background: #f8fbff;
      border: 1px solid #e6edf6;
    }
    .meta-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8ba0b7; font-weight: 700; }
    .meta-value { margin-top: 6px; font-size: 14px; font-weight: 700; color: #2f435d; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .status.pending { background: var(--warning-soft); color: var(--warning); border-color: #f5d7ab; }
    .status.approved { background: var(--success-soft); color: var(--success); border-color: #cde8d4; }
    .status.rejected { background: var(--danger-soft); color: var(--danger); border-color: #f4c2cf; }
    .status.rescheduled { background: var(--accent-soft); color: var(--accent); border-color: #d9d6ff; }
    .status.completed { background: #eef2f7; color: #475569; border-color: #dde5ee; }

    .inline-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .segment {
      display: inline-flex;
      background: rgba(255,255,255,0.92);
      border: 1px solid #e4edf6;
      border-radius: 18px;
      padding: 6px;
      box-shadow: var(--shadow);
      gap: 6px;
    }
    .segment button {
      border: 0;
      background: transparent;
      color: #64748b;
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .segment button.active {
      background: linear-gradient(135deg, #e7fbf7 0%, #f2f8ff 100%);
      color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(15,118,110,0.12);
    }

    .chip-list { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip {
      padding: 10px 13px;
      border-radius: 999px;
      background: #f3f7fb;
      border: 1px solid #e1eaf4;
      color: #3d536f;
      font-size: 13px;
      font-weight: 700;
    }

    .note-list { display: grid; gap: 12px; }
    .note-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      color: #4b5f79;
      font-size: 14px;
      line-height: 1.6;
      padding: 12px 0;
      border-top: 1px solid #edf2f7;
    }
    .note-item:first-child { border-top: 0; padding-top: 0; }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%);
      margin-top: 7px;
      flex: 0 0 auto;
    }

    .mobile-topbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 18px 18px 0;
      gap: 12px;
    }
    .mobile-menu {
      border: 0;
      background: white;
      width: 46px;
      height: 46px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    .empty {
      padding: 28px;
      border-radius: 22px;
      background: linear-gradient(135deg, #f8fbff 0%, #ffffff 100%);
      border: 1px dashed #d7e3ee;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 1180px) {
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .main-grid.two-col, .main-grid.admin { grid-template-columns: 1fr; }
    }

    @media (max-width: 920px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 40;
        width: min(88vw, 320px);
        transform: translateX(-105%);
        transition: 0.22s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .content { padding: 18px; }
      .mobile-topbar { display: flex; }
      .hero { flex-direction: column; }
      .top-actions { width: 100%; justify-content: stretch; }
      .searchbox { width: 100%; }
      .searchbox input { min-width: 0; width: 100%; }
      .hero h2 { font-size: 30px; }
    }

    @media (max-width: 700px) {
      .stats-grid { grid-template-columns: 1fr; }
      .form-grid, .meta-grid { grid-template-columns: 1fr; }
      .card { padding: 18px; border-radius: 22px; }
      .stat-card { padding: 18px; }
      .appointment-top { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="mobile-topbar">
    <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
    <div class="ghost-panel" style="flex:1; justify-content:center; font-weight:800;">Guidance Appointment System</div>
  </div>
  <div id="app"></div>

  <script>
    const state = {
      role: 'student',
      sidebarOpen: false,
      counselorTab: 'requests',
      search: '',
      successMessage: '',
      form: {
        student: 'Benedict Tanghal',
        purpose: 'Counseling',
        counselor: 'Ms. Rivera',
        date: '',
        time: '09:00 AM',
        note: ''
      },
      appointments: [
        {
          id: 1,
          student: 'Benedict Tanghal',
          purpose: 'Academic Advising',
          counselor: 'Ms. Rivera',
          date: '2026-04-25',
          time: '09:00 AM',
          status: 'Pending',
          note: 'Need help with subject planning for next semester.'
        },
        {
          id: 2,
          student: 'Angela Cruz',
          purpose: 'Counseling',
          counselor: 'Mr. Santos',
          date: '2026-04-26',
          time: '01:30 PM',
          status: 'Approved',
          note: 'Personal concern and stress management.'
        },
        {
          id: 3,
          student: 'Miguel Reyes',
          purpose: 'Student Support',
          counselor: 'Ms. Rivera',
          date: '2026-04-27',
          time: '10:30 AM',
          status: 'Rescheduled',
          note: 'Follow-up for support documents.'
        }
      ],
      slots: {
        'Ms. Rivera': ['09:00 AM', '10:30 AM', '02:00 PM'],
        'Mr. Santos': ['08:30 AM', '01:30 PM', '03:00 PM']
      }
    };

    const app = document.getElementById('app');

    function iconSymbol(type) {
      return {
        total: '🗓️',
        pending: '⏳',
        approved: '✅',
        users: '👥',
        dashboard: '▦',
        appointments: '☰',
        schedule: '🕒',
        notifications: '🔔',
        settings: '⚙️'
      }[type] || '•';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function statusClass(status) {
      return String(status || '').toLowerCase();
    }

    function filteredAppointments() {
      const q = state.search.trim().toLowerCase();
      if (!q) return [...state.appointments];
      return state.appointments.filter(item =>
        [item.student, item.purpose, item.counselor, item.status, item.date, item.time, item.note]
          .join(' ')
          .toLowerCase()
          .includes(q)
      );
    }

    function roleTitle() {
      return state.role === 'student' ? 'Student Dashboard' : state.role === 'counselor' ? 'Counselor Dashboard' : 'Admin Dashboard';
    }

    function statData() {
      const all = state.appointments;
      return [
        { title: 'Total Appointments', value: all.length, sub: 'All current records', icon: iconSymbol('total') },
        { title: 'Pending Requests', value: all.filter(a => a.status === 'Pending').length, sub: 'Awaiting counselor action', icon: iconSymbol('pending') },
        { title: 'Approved', value: all.filter(a => a.status === 'Approved').length, sub: 'Confirmed schedules', icon: iconSymbol('approved') },
        { title: 'Active Counselors', value: new Set(all.map(a => a.counselor)).size, sub: 'Counselors in the system', icon: iconSymbol('users') }
      ];
    }

    function appointmentCard(item, withActions = false) {
      return `
        <div class="appointment-card">
          <div class="appointment-top">
            <div>
              <h4 class="appointment-title">${escapeHtml(item.purpose)}</h4>
              <div class="appointment-note">${escapeHtml(item.note)}</div>
            </div>
            <span class="status ${statusClass(item.status)}">${escapeHtml(item.status)}</span>
          </div>
          <div class="meta-grid">
            <div class="meta-box">
              <div class="meta-label">Student</div>
              <div class="meta-value">${escapeHtml(item.student)}</div>
            </div>
            <div class="meta-box">
              <div class="meta-label">Counselor</div>
              <div class="meta-value">${escapeHtml(item.counselor)}</div>
            </div>
            <div class="meta-box">
              <div class="meta-label">Schedule</div>
              <div class="meta-value">${escapeHtml(item.date)} • ${escapeHtml(item.time)}</div>
            </div>
          </div>
          ${withActions ? `
            <div class="inline-actions">
              <button class="btn btn-success btn-sm" onclick="updateStatus(${item.id}, 'Approved')">Approve</button>
              <button class="btn btn-warning btn-sm" onclick="updateStatus(${item.id}, 'Rescheduled')">Reschedule</button>
              <button class="btn btn-danger btn-sm" onclick="updateStatus(${item.id}, 'Rejected')">Reject</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderSidebar() {
      return `
        <aside class="sidebar ${state.sidebarOpen ? 'open' : ''}">
          <div class="brand">
            <div class="brand-logo">G</div>
            <div>
              <h1>Guidance Appoint</h1>
              <p>School Support Portal</p>
            </div>
          </div>

          <div class="nav-group">
            <div class="nav-label">Workspace</div>
            <button class="nav-item active"><span class="nav-icon">${iconSymbol('dashboard')}</span> Dashboard</button>
            <button class="nav-item"><span class="nav-icon">${iconSymbol('appointments')}</span> Appointments</button>
            <button class="nav-item"><span class="nav-icon">${iconSymbol('schedule')}</span> Schedule</button>
            <button class="nav-item"><span class="nav-icon">${iconSymbol('notifications')}</span> Notifications</button>
            <button class="nav-item"><span class="nav-icon">${iconSymbol('settings')}</span> Settings</button>
          </div>

          <div class="role-card">
            <h3>Role Preview</h3>
            <p>Switch views to preview the student, counselor, and admin experience inside one polished demo.</p>
            <select onchange="setRole(this.value)">
              <option value="student" ${state.role === 'student' ? 'selected' : ''}>Student</option>
              <option value="counselor" ${state.role === 'counselor' ? 'selected' : ''}>Counselor</option>
              <option value="admin" ${state.role === 'admin' ? 'selected' : ''}>Admin</option>
            </select>
          </div>
        </aside>
      `;
    }

    function renderStudent() {
      const mine = state.appointments.filter(a => a.student === state.form.student);
      return `
        <div class="main-grid two-col">
          <section class="card">
            <div class="card-header">
              <div>
                <h3>Book an Appointment</h3>
                <p class="sub">A calmer, clearer booking flow with stronger spacing, softer colors, better contrast, and easier scanning for students.</p>
              </div>
            </div>
            ${state.successMessage ? `<div class="banner-success">${escapeHtml(state.successMessage)}</div>` : ''}
            <div class="form-grid">
              <div class="field full">
                <label>Purpose</label>
                <select onchange="updateForm('purpose', this.value)">
                  <option value="Counseling" ${state.form.purpose === 'Counseling' ? 'selected' : ''}>Counseling</option>
                  <option value="Academic Advising" ${state.form.purpose === 'Academic Advising' ? 'selected' : ''}>Academic Advising</option>
                  <option value="Student Support" ${state.form.purpose === 'Student Support' ? 'selected' : ''}>Student Support</option>
                </select>
              </div>
              <div class="field">
                <label>Counselor</label>
                <select onchange="changeCounselor(this.value)">
                  ${Object.keys(state.slots).map(name => `<option value="${escapeHtml(name)}" ${state.form.counselor === name ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('')}
                </select>
              </div>
              <div class="field">
                <label>Date</label>
                <input type="date" value="${escapeHtml(state.form.date)}" onchange="updateForm('date', this.value)">
              </div>
              <div class="field">
                <label>Time Slot</label>
                <select onchange="updateForm('time', this.value)">
                  ${(state.slots[state.form.counselor] || []).map(slot => `<option value="${escapeHtml(slot)}" ${state.form.time === slot ? 'selected' : ''}>${escapeHtml(slot)}</option>`).join('')}
                </select>
              </div>
              <div class="field full">
                <label>Short Description</label>
                <textarea placeholder="Briefly describe your concern..." onchange="updateForm('note', this.value)" oninput="updateForm('note', this.value)">${escapeHtml(state.form.note)}</textarea>
              </div>
            </div>
            <div class="button-row">
              <button class="btn btn-secondary" onclick="resetForm()">Clear Form</button>
              <button class="btn btn-primary" onclick="submitAppointment()">Submit Request</button>
            </div>
          </section>

          <section class="card">
            <div class="card-header">
              <div>
                <h3>My Appointments</h3>
                <p class="sub">Students can quickly review appointment status, counselor assignment, and schedule without feeling overwhelmed.</p>
              </div>
            </div>
            <div class="appointments-list">
              ${mine.length ? mine.map(item => appointmentCard(item)).join('') : '<div class="empty">No appointments yet. Your requests will appear here after you submit one.</div>'}
            </div>
          </section>
        </div>
      `;
    }

    function renderCounselor() {
      const counselorName = 'Ms. Rivera';
      const rows = filteredAppointments().filter(a => a.counselor === counselorName);
      return `
        <div class="main-grid">
          <div class="segment">
            <button class="${state.counselorTab === 'requests' ? 'active' : ''}" onclick="setCounselorTab('requests')">Requests</button>
            <button class="${state.counselorTab === 'schedule' ? 'active' : ''}" onclick="setCounselorTab('schedule')">Schedule</button>
          </div>

          ${state.counselorTab === 'requests' ? `
            <section class="card">
              <div class="card-header">
                <div>
                  <h3>Incoming Appointment Requests</h3>
                  <p class="sub">Counselors get a cleaner review flow with softer cards, clearer status chips, and action buttons that are easier to understand.</p>
                </div>
              </div>
              <div class="appointments-list">
                ${rows.length ? rows.map(item => appointmentCard(item, true)).join('') : '<div class="empty">No matching appointment requests for this counselor.</div>'}
              </div>
            </section>
          ` : `
            <section class="card">
              <div class="card-header">
                <div>
                  <h3>Available Time Slots</h3>
                  <p class="sub">Preview the appointment schedule with a less harsh layout and much better visual rhythm.</p>
                </div>
              </div>
              <div class="main-grid two-col" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">
                ${Object.entries(state.slots).map(([name, slots]) => `
                  <div class="appointment-card">
                    <div class="appointment-top">
                      <div>
                        <h4 class="appointment-title">${escapeHtml(name)}</h4>
                        <div class="appointment-note">Open slots students can book from the website interface.</div>
                      </div>
                    </div>
                    <div class="chip-list">
                      ${slots.map(slot => `<span class="chip">${escapeHtml(slot)}</span>`).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>
          `}
        </div>
      `;
    }

    function renderAdmin() {
      const rows = filteredAppointments();
      return `
        <div class="main-grid admin">
          <section class="card">
            <div class="card-header">
              <div>
                <h3>Appointment Overview</h3>
                <p class="sub">Admins can monitor the whole system in a more premium dashboard layout with stronger spacing and less visual strain.</p>
              </div>
            </div>
            <div class="appointments-list">
              ${rows.length ? rows.map(item => appointmentCard(item)).join('') : '<div class="empty">No records match your current search.</div>'}
            </div>
          </section>

          <div class="main-grid" style="gap: 18px;">
            <section class="card">
              <div class="card-header">
                <div>
                  <h3>Quick Actions</h3>
                  <p class="sub">Suggested admin controls for the next phase of the project.</p>
                </div>
              </div>
              <div class="button-row" style="justify-content: stretch; flex-direction: column; margin-top:0;">
                <button class="btn btn-primary" style="width:100%; text-align:left;">Add Counselor</button>
                <button class="btn btn-secondary" style="width:100%; text-align:left;">Manage Concern Types</button>
                <button class="btn btn-secondary" style="width:100%; text-align:left;">View Reports</button>
                <button class="btn btn-secondary" style="width:100%; text-align:left;">Export Appointments</button>
              </div>
            </section>
            <section class="card">
              <div class="card-header">
                <div>
                  <h3>System Notes</h3>
                  <p class="sub">What was improved in this full rebuild.</p>
                </div>
              </div>
              <div class="note-list">
                <div class="note-item"><span class="dot"></span><div>Fixed the blank white screen by replacing the incomplete script with a full standalone interface.</div></div>
                <div class="note-item"><span class="dot"></span><div>Softened the entire color system so the interface is calmer and easier on the eyes.</div></div>
                <div class="note-item"><span class="dot"></span><div>Improved spacing, card hierarchy, mobile responsiveness, and action clarity across all views.</div></div>
                <div class="note-item"><span class="dot"></span><div>Kept the same project concept while making it feel more like a polished school platform.</div></div>
              </div>
            </section>
          </div>
        </div>
      `;
    }

    function renderMain() {
      return `
        <main class="content">
          <section class="hero">
            <div>
              <span class="eyebrow">Guidance Appointment System</span>
              <h2>${roleTitle()}</h2>
              <p>A redesigned website prototype for counseling, academic advising, and student support. The interface now focuses on comfort, readability, balance, and smoother decision-making for users.</p>
            </div>
            <div class="top-actions">
              <div class="searchbox">
                <span>🔎</span>
                <input type="text" placeholder="Search appointments" value="${escapeHtml(state.search)}" oninput="setSearch(this.value)">
              </div>
            </div>
          </section>

          <section class="stats-grid">
            ${statData().map(item => `
              <div class="stat-card">
                <div class="stat-top">
                  <div>
                    <p class="stat-title">${escapeHtml(item.title)}</p>
                    <div class="stat-value">${escapeHtml(item.value)}</div>
                    <div class="stat-sub">${escapeHtml(item.sub)}</div>
                  </div>
                  <div class="icon-chip">${escapeHtml(item.icon)}</div>
                </div>
              </div>
            `).join('')}
          </section>

          ${state.role === 'student' ? renderStudent() : state.role === 'counselor' ? renderCounselor() : renderAdmin()}
        </main>
      `;
    }

    function render() {
      app.innerHTML = `<div class="app-shell">${renderSidebar()}${renderMain()}</div>`;
    }

    function setRole(role) {
      state.role = role;
      state.sidebarOpen = false;
      render();
    }
    function setSearch(value) {
      state.search = value;
      render();
    }
    function updateForm(field, value) {
      state.form[field] = value;
    }
    function changeCounselor(value) {
      state.form.counselor = value;
      state.form.time = (state.slots[value] || [])[0] || '';
      render();
    }
    function resetForm() {
      state.form = {
        student: 'Benedict Tanghal',
        purpose: 'Counseling',
        counselor: 'Ms. Rivera',
        date: '',
        time: '09:00 AM',
        note: ''
      };
      state.successMessage = '';
      render();
    }
    function submitAppointment() {
      if (!state.form.date || !state.form.time || !state.form.note.trim()) {
        alert('Please complete the required fields first.');
        return;
      }
      state.appointments.unshift({
        id: Date.now(),
        student: state.form.student,
        purpose: state.form.purpose,
        counselor: state.form.counselor,
        date: state.form.date,
        time: state.form.time,
        status: 'Pending',
        note: state.form.note.trim()
      });
      state.successMessage = 'Appointment request submitted successfully.';
      resetForm();
      state.successMessage = 'Appointment request submitted successfully.';
      render();
    }
    function updateStatus(id, status) {
      state.appointments = state.appointments.map(item => item.id === id ? { ...item, status } : item);
      render();
    }
    function setCounselorTab(tab) {
      state.counselorTab = tab;
      render();
    }
    function toggleSidebar() {
      state.sidebarOpen = !state.sidebarOpen;
      render();
    }

    window.setRole = setRole;
    window.setSearch = setSearch;
    window.updateForm = updateForm;
    window.changeCounselor = changeCounselor;
    window.resetForm = resetForm;
    window.submitAppointment = submitAppointment;
    window.updateStatus = updateStatus;
    window.setCounselorTab = setCounselorTab;
    window.toggleSidebar = toggleSidebar;

    render();
  </script>
</body>
</html>
